# Vox Hybrid 4-Repository Federation Catalog (SSOT)
# - `vox` (`.`): Core public monorepo workspace.
# - `vox-ops` (`../vox-ops`, `optional: true`): Standalone private sibling repository; gracefully skipped when absent on public clones.
# - `vox-axis` (`crates/vox-gui`) & `voxlang.org` (`docs-astro`): Canonical in-monorepo roots; `vox_repository::federation` automatically promotes external sibling checkouts (`../vox-axis`, `../voxlang.org`) as mirror targets when present on disk.
schema_version: 1
primary_repository_id: vox
repositories:
  - repository_id: vox
    display_name: vox
    root_path: .
    access_mode: local
    role: core
    optional: false
    capabilities:
      - read_file
      - list_files
      - text_search
      - history_search
    shared_contracts:
      - contracts/wire/
      - contracts/ipc/
      - contracts/telemetry/
      - contracts/gui/
      - contracts/documentation/
    cargo_patch_crates: []

  - repository_id: vox-ops
    display_name: vox-ops
    root_path: ../vox-ops
    access_mode: local
    role: private-ops
    optional: true
    capabilities:
      - read_file
      - list_files
      - text_search
      - history_search
    shared_contracts:
      - contracts/wire/
      - contracts/ipc/
      - contracts/telemetry/
    cargo_patch_crates:
      - vox-ops

  - repository_id: vox-axis
    display_name: vox-axis
    root_path: crates/vox-gui
    access_mode: local
    role: gui-surface
    optional: false
    capabilities:
      - read_file
      - list_files
      - text_search
    shared_contracts:
      - contracts/gui/
      - contracts/telemetry/
    cargo_patch_crates: []

  - repository_id: voxlang.org
    display_name: voxlang.org
    root_path: docs-astro
    access_mode: local
    role: docs-site
    optional: false
    capabilities:
      - read_file
      - list_files
      - text_search
    shared_contracts:
      - contracts/documentation/
    cargo_patch_crates: []
