<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>Vox</title>
  <defs>
    <linearGradient id="vox-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#141419" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>
    <linearGradient id="vox-main" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="vox-prism" x1="160" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <radialGradient id="vox-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Obsidian & Brand-Tinted Squircle Chassis -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0a0a0d" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#vox-bg)" />
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#vox-main)" stroke-width="16" stroke-opacity="0.95" />

  <!-- Radial Core Glow -->
  <circle cx="256" cy="256" r="216" fill="url(#vox-glow)" />

  <!-- Semiotic Viewfinder Corner Brackets -->
  <path d="M86 134V102C86 93.163 93.163 86 102 86H134" stroke="#818cf8" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />
  <path d="M378 86H410C418.837 86 426 93.163 426 102V134" stroke="#818cf8" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />
  <path d="M86 378V410C86 418.837 93.163 426 102 426H134" stroke="#818cf8" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />
  <path d="M378 426H410C418.837 426 426 418.837 426 410V378" stroke="#818cf8" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />

  <!-- Multi-Layer Bespoke Semiotic Geometry (1.06x Optical Presence Scale) -->
  <g transform="translate(256 256) scale(1.06) translate(-256 -256)">
    <line x1="124" y1="256" x2="364" y2="256" stroke="url(#vox-main)" stroke-width="10" stroke-linecap="round" opacity="0.35" />
    <rect x="117" y="208" width="22" height="96" rx="11" fill="url(#vox-main)" />
    <rect x="154" y="160" width="24" height="192" rx="12" fill="url(#vox-main)" />
    <rect x="193" y="192" width="22" height="128" rx="11" fill="url(#vox-main)" />
    <line x1="252" y1="256" x2="356" y2="164" stroke="url(#vox-prism)" stroke-width="24" stroke-linecap="round" />
    <line x1="252" y1="256" x2="356" y2="348" stroke="url(#vox-prism)" stroke-width="24" stroke-linecap="round" />
    <circle cx="252" cy="256" r="30" fill="url(#vox-prism)" />
    <circle cx="356" cy="164" r="32" fill="url(#vox-prism)" />
    <circle cx="356" cy="348" r="32" fill="url(#vox-prism)" />
    <circle cx="252" cy="256" r="13" fill="#4338ca" />
    <circle cx="356" cy="164" r="13" fill="#4338ca" />
    <circle cx="356" cy="348" r="13" fill="#4338ca" />
    <circle cx="252" cy="256" r="6" fill="#ffffff" />
  </g>
</svg>
