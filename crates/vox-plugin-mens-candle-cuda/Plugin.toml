[plugin]
id = "mens-candle-cuda"
name = "Mens (Candle + CUDA)"
version = "0.6.0"
description = "ML training backend using Candle with CUDA acceleration."
license = "Apache-2.0"

[plugin.host]
min-vox-version = "0.5.0"

[plugin.payload]
kind = "code"
abi-version = 12

[plugin.payload.provides]
extension-points = ["MlBackend"]

[plugin.payload.requires]
# This manifest describes the `cuda`-feature build only. The no-feature
# build ships as a separate plugin, mens-candle-cpu, packaged with
# Plugin.cpu.toml (the CUDA build links libcuda at load time, so it can't
# double as the CPU fallback). This `requires` block is informational only:
# neither `vox plugin install` nor `vox-plugin-host::load_code_plugin`
# enforces it today, only the per-target `artifacts` map below.
os = ["windows", "linux"]
arch = ["x86_64", "aarch64"]
native-libs = [
    { name = "cudart", min-version = "12.0" },
    { name = "cublas" },
]

[plugin.payload.artifacts]
"windows-x86_64" = "vox_plugin_mens_candle_cuda.dll"
"linux-x86_64"   = "libvox_plugin_mens_candle_cuda.so"
