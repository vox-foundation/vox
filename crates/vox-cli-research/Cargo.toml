[package]
name = "vox-cli-research"
description = "Research commands (run/eval/infra/mesh-intake) extracted from vox-cli."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
## Live LLM inference in the research pipeline (forwards to vox-research-shim/runtime).
runtime = ["vox-research-shim/runtime"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
owo-colors = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
uuid = { workspace = true, features = ["v4"] }
vox-db = { workspace = true }
vox-foundation = { workspace = true }
vox-orchestrator = { workspace = true }
vox-publisher = { workspace = true }
vox-repository = { workspace = true }
vox-research-shim = { workspace = true }
vox-search = { workspace = true }
vox-secrets = { workspace = true }
workspace-hack = { version = "0.6", path = "../workspace-hack" }

[[test]]
name = "eval_e2e_test"
required-features = ["runtime"]

[lints]
workspace = true
