[package]
name = "vox-speech"
description = "Vox speech-to-text (Oratio) — transcript refinement, routing and Sherpa-ONNX STT; Candle Whisper lives in vox-plugin-speech"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["vox", "speech", "stt", "whisper"]
categories = ["multimedia::audio"]

[features]
# Heavy deps (sherpa-onnx, hf-hub, symphonia, rubato) are NOT default: consumers opt
# in via `features = ["stt-sherpa"]` or `["audio-decode"]`. This keeps native STT code
# out of crates that only need lightweight surfaces like `refine`, `routing`, or
# `runtime_config`.
# `compiler-rerank` IS default: it only pulls `vox-compiler` (already linked into the
# shipped vox-gui binary via vox-cli/vox-orchestrator-mcp), and it is domain-gated at
# runtime (see transcript_rerank.rs) so it only runs its compiler-frontend pass for
# `DomainMode::Code` dictation.
default = ["compiler-rerank"]
# Audio file decoding + 16 kHz resampling for in-process transcription paths (Sherpa,
# subtitles, sessions). Candle Whisper itself lives in vox-plugin-speech and is reached
# through `backend_dispatch::register_whisper_transcriber`.
audio-decode = ["dep:symphonia", "dep:rubato"]
# Prefer transcript hypotheses that lex/parse/typecheck as Vox better (for speech-to-code).
compiler-rerank = ["dep:vox-compiler"]
# `hf-hub` downloads the Sherpa model (sherpa_model_config.rs); `audio-decode` decodes
# audio files and supplies rubato for sherpa_onnx.rs's resample_to_16k.
stt-sherpa = ["dep:sherpa-onnx", "dep:hf-hub", "audio-decode"]
cloud = ["dep:vox-populi", "dep:tokio", "dep:vox-http-client", "dep:async-trait", "dep:reqwest"]
serve = ["dep:axum", "axum/multipart", "dep:tokio"]

[dependencies]
vox-config = { workspace = true }
vox-populi = { workspace = true, optional = true, features = ["mens-cloud"] }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
vox-http-client = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
anyhow = { workspace = true }
vox-compiler = { workspace = true, optional = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
axum = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true, default-features = false, features = [
    "aac",
    "alac",
    "flac",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
rubato = { workspace = true, optional = true }
uuid = { workspace = true }
tempfile = { workspace = true }
sherpa-onnx = { workspace = true, optional = true }
workspace-hack = { version = "0.6", path = "../workspace-hack" }
vox-secrets.workspace = true

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
