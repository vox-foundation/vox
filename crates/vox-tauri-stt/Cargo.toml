[package]
name = "vox-tauri-stt"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Speech-to-text bridge types + guest JS for desktop Tauri 2 apps (register the plugin in your app's src-tauri). Tauri is desktop-only; mobile uses the React Native target."
publish = false

[lib]
name = "vox_tauri_stt"
path = "src/lib.rs"

[features]
default = []
# Tauri 2 plugin (`init`) + `transcribe` command — enable from generated `src-tauri`.
tauri-plugin = ["dep:tauri"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { workspace = true, optional = true }
workspace-hack = { version = "0.6", path = "../workspace-hack" }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
