[package]
name        = "vox-effort-route"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Routes effort-audit findings to verified, drafted enforcement artifacts"

[dependencies]
vox-effort-audit  = { workspace = true }
vox-actor-runtime = { workspace = true }
vox-config        = { workspace = true }
vox-telemetry     = { workspace = true }
vox-git           = { workspace = true }
anyhow            = { workspace = true }
gix               = { workspace = true }
serde             = { workspace = true, features = ["derive"] }
serde_json        = { workspace = true }
chrono            = { workspace = true }
uuid              = { workspace = true, features = ["v4"] }
tracing           = { workspace = true }
tokio             = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
futures           = { workspace = true }
thiserror         = { workspace = true }
async-trait       = { workspace = true }
workspace-hack = { version = "0.6", path = "../workspace-hack" }

[dev-dependencies]
insta             = { workspace = true, features = ["json"] }
tempfile          = { workspace = true }
toml              = { workspace = true }
tokio             = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
