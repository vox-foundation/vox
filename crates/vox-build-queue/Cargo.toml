[package]
name = "vox-build-queue"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
description = "Fair FIFO build queue, cargo resolution, and build metrics for the vox build broker"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
