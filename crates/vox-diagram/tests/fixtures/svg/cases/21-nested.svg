<text class="vd-container-label" x="89.5" y="303.5" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="89.5" dy="0">A very long</tspan><tspan x="89.5" dy="16">title that keeps</tspan><tspan x="89.5" dy="16">going on and on</tspan><tspan x="89.5" dy="16">for sixty chars</tspan></text>
