<rect class="vd-container" x="401.5" y="951" width="273.5" height="280" rx="6" style="fill:var(--vd-container-fill,#f6f8fa);stroke:var(--vd-container-stroke,#848d97);stroke-width:1.5"/>
<text class="vd-container-label" x="538" y="969" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="538" dy="0">A very long title that keeps</tspan><tspan x="538" dy="16">going on and on for sixty</tspan><tspan x="538" dy="16">chars</tspan></text>
