<text class="vd-edge-label" x="357" y="611" text-anchor="middle" style="fill:var(--vd-muted,#57606a);stroke:none"><tspan x="357" dy="0">down</tspan></text>
<rect class="vd-edge-label-bg" x="897.5" y="576" width="25" height="26" style="fill:var(--vd-bg,#fff);stroke:none"/>
<text class="vd-edge-label" x="910" y="594" text-anchor="middle" style="fill:var(--vd-muted,#57606a);stroke:none"><tspan x="910" dy="0">up</tspan></text>
