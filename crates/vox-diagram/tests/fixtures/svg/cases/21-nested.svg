<text class="vd-container-label" x="428.5" y="400" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="428.5" dy="0">A very long title that keeps</tspan><tspan x="428.5" dy="16">going on and on for sixty</tspan><tspan x="428.5" dy="16">chars</tspan></text>
