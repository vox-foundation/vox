<text class="vd-label" x="92.5" y="406" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="92.5" dy="0">Decide?</tspan><tspan x="92.5" dy="18">yes or no</tspan></text>
</g>
