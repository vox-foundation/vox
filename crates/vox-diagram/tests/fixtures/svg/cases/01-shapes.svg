<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 720" role="img" aria-labelledby="vd-title vd-desc" class="vd-diagram" style="font-family:var(--vd-font,Arimo,Arial,Liberation Sans,Helvetica,sans-serif);font-size:14px">
<title id="vd-title">Diagram</title>
