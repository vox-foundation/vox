<rect class="vd-node-shape" x="124" y="16" width="67" height="38" rx="3" style="fill:var(--vd-node-fill,#fff);stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<text class="vd-label" x="157.5" y="40" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="157.5" dy="0">Client</tspan></text>
</g>
<g class="vd-node">
<rect class="vd-node-shape" x="117.5" y="524" width="80.5" height="38" rx="3" style="fill:var(--vd-node-fill,#fff);stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<text class="vd-label" x="157.5" y="548" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="157.5" dy="0">Outside</tspan></text>
</g>
<g class="vd-node">
<rect class="vd-node-shape" x="125.5" y="230" width="64" height="38" rx="3" style="fill:var(--vd-node-fill,#fff);stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<text class="vd-label" x="157.5" y="254" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="157.5" dy="0">API</tspan></text>
</g>
<g class="vd-node">
<rect class="vd-node-shape" x="125.5" y="354" width="64.5" height="54" rx="32" ry="8" style="fill:var(--vd-node-fill,#fff);stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<path class="vd-node-rim" d="M125.5 362A32 8 0 0 0 190 362" style="fill:none;stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<text class="vd-label" x="157.5" y="386" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="157.5" dy="0">Store</tspan></text>
</g>
