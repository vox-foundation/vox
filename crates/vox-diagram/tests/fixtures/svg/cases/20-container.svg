<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 407 518" role="img" aria-labelledby="vd-title vd-desc" class="vd-diagram" style="font-family:var(--vd-font,system-ui,sans-serif);font-size:14px">
<title id="vd-title">Diagram</title>
<desc id="vd-desc">4 nodes, 3 edges: API → Store; Client → API; Store → Outside</desc>
<defs>
<marker id="vd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0L10 5L0 10z" style="fill:var(--vd-edge,#57606a)"/>
</marker>
</defs>
<g class="vd-containers">
<rect class="vd-container" x="16" y="114" width="375" height="272" rx="6" style="fill:var(--vd-container-fill,#f6f8fa);stroke:var(--vd-container-stroke,#848d97);stroke-width:1.5"/>
<text class="vd-container-label" x="203.5" y="132" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="203.5" dy="0">Backend services</tspan></text>
</g>
<g class="vd-edges" style="fill:none;stroke:var(--vd-edge,#57606a);stroke-width:1.5">
<path class="vd-edge" d="M290 208L290 251L290 294" marker-end="url(#vd-arrow)"/>
<path class="vd-edge" d="M290 54L290 97L290 140L290 170" marker-end="url(#vd-arrow)"/>
<path class="vd-edge" d="M290 348L290 378L290 421L290 464" marker-end="url(#vd-arrow)"/>
</g>
<g class="vd-nodes">
<g class="vd-node">
<rect class="vd-node-shape" x="256.5" y="16" width="67" height="38" rx="3" style="fill:var(--vd-node-fill,#fff);stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<text class="vd-label" x="290" y="40" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="290" dy="0">Client</tspan></text>
</g>
<g class="vd-node">
<rect class="vd-node-shape" x="249.5" y="464" width="80.5" height="38" rx="3" style="fill:var(--vd-node-fill,#fff);stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<text class="vd-label" x="289.5" y="488" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="289.5" dy="0">Outside</tspan></text>
</g>
<g class="vd-node">
<rect class="vd-node-shape" x="258" y="170" width="64" height="38" rx="3" style="fill:var(--vd-node-fill,#fff);stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<text class="vd-label" x="290" y="194" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="290" dy="0">API</tspan></text>
</g>
<g class="vd-node">
<rect class="vd-node-shape" x="257.5" y="294" width="64.5" height="54" rx="32" ry="8" style="fill:var(--vd-node-fill,#fff);stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<path class="vd-node-rim" d="M257.5 302A32 8 0 0 0 322 302" style="fill:none;stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<text class="vd-label" x="289.5" y="326" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="289.5" dy="0">Store</tspan></text>
</g>
</g>
<g class="vd-edge-labels">
<rect class="vd-edge-label-bg" x="267" y="238" width="46" height="26" style="fill:var(--vd-bg,#fff);stroke:none"/>
<text class="vd-edge-label" x="290" y="256" text-anchor="middle" style="fill:var(--vd-muted,#57606a);stroke:none"><tspan x="290" dy="0">reads</tspan></text>
<rect class="vd-edge-label-bg" x="260.5" y="84" width="58.5" height="26" style="fill:var(--vd-bg,#fff);stroke:none"/>
<text class="vd-edge-label" x="289.5" y="102" text-anchor="middle" style="fill:var(--vd-muted,#57606a);stroke:none"><tspan x="289.5" dy="0">request</tspan></text>
<rect class="vd-edge-label-bg" x="264.5" y="408" width="50.5" height="26" style="fill:var(--vd-bg,#fff);stroke:none"/>
<text class="vd-edge-label" x="289.5" y="426" text-anchor="middle" style="fill:var(--vd-muted,#57606a);stroke:none"><tspan x="289.5" dy="0">export</tspan></text>
</g>
</svg>
