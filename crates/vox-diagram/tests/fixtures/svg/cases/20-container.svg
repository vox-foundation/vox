<path d="M0 0L10 5L0 10z" style="fill:var(--vd-edge,#57606a)"/>
</marker>
</defs>
<g class="vd-containers">
<rect class="vd-container" x="16" y="136" width="243" height="280" rx="6" style="fill:var(--vd-container-fill,#f6f8fa);stroke:var(--vd-container-stroke,#848d97);stroke-width:1.5"/>
<text class="vd-container-label" x="93" y="162" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="93" dy="0">Backend services</tspan></text>
</g>
<g class="vd-edges" style="fill:none;stroke:var(--vd-edge,#57606a);stroke-width:1.5">
<path class="vd-edge" d="M157.5 268L157.5 311L157.5 354" marker-end="url(#vd-arrow)"/>
<path class="vd-edge" d="M182.5 54L216 79.5Q222 84 222 92L222 114L222 157L222 192Q222 200 216 204.5L182.5 230" marker-end="url(#vd-arrow)"/>
<path class="vd-edge" d="M157.5 408L157.5 438L157.5 481L157.5 524" marker-end="url(#vd-arrow)"/>
</g>
<g class="vd-nodes">
