<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 311.5 488" role="img" aria-labelledby="vd-title vd-desc" class="vd-diagram" style="font-family:var(--vd-font,Arimo,Arial,Liberation Sans,Helvetica,sans-serif);font-size:14px">
<title id="vd-title">Diagram</title>
<desc id="vd-desc">4 nodes, 3 edges: API → Store; Client → API; Store → Outside</desc>
<defs>
<marker id="vd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0L10 5L0 10z" style="fill:var(--vd-edge,#57606a)"/>
</marker>
</defs>
<g class="vd-containers">
<rect class="vd-container" x="16" y="18" width="164" height="308" rx="6" style="fill:var(--vd-container-fill,#f6f8fa);stroke:var(--vd-container-stroke,#848d97);stroke-width:1.5"/>
<text class="vd-container-label" x="93" y="40" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="93" dy="0">Backend services</tspan></text>
</g>
<g class="vd-edges" style="fill:none;stroke:var(--vd-edge,#57606a);stroke-width:1.5">
<path class="vd-edge" d="M118 178L118 221L118 264" marker-end="url(#vd-arrow)"/>
<path class="vd-edge" d="M228.5 52.5L150 93.5Q143 97 140 104L125.5 140" marker-end="url(#vd-arrow)"/>
<path class="vd-edge" d="M118 318L118 348L118 391L118 434" marker-end="url(#vd-arrow)"/>
</g>
<g class="vd-nodes">
<g class="vd-node">
<rect class="vd-node-shape" x="228.5" y="16" width="67" height="38" rx="3" style="fill:var(--vd-node-fill,#fff);stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<text class="vd-label" x="262" y="40" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="262" dy="0">Client</tspan></text>
</g>
<g class="vd-node">
<rect class="vd-node-shape" x="77.5" y="434" width="80.5" height="38" rx="3" style="fill:var(--vd-node-fill,#fff);stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<text class="vd-label" x="117.5" y="458" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="117.5" dy="0">Outside</tspan></text>
</g>
<g class="vd-node">
<rect class="vd-node-shape" x="86" y="140" width="64" height="38" rx="3" style="fill:var(--vd-node-fill,#fff);stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<text class="vd-label" x="118" y="164" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="118" dy="0">API</tspan></text>
</g>
<g class="vd-node">
<rect class="vd-node-shape" x="85.5" y="264" width="64.5" height="54" rx="32" ry="8" style="fill:var(--vd-node-fill,#fff);stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<path class="vd-node-rim" d="M85.5 272A32 8 0 0 0 150 272" style="fill:none;stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<text class="vd-label" x="117.5" y="296" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="117.5" dy="0">Store</tspan></text>
</g>
</g>
<g class="vd-edge-labels">
<rect class="vd-edge-label-bg" x="95" y="208" width="46" height="26" style="fill:var(--vd-bg,#fff);stroke:none"/>
<text class="vd-edge-label" x="118" y="226" text-anchor="middle" style="fill:var(--vd-muted,#57606a);stroke:none"><tspan x="118" dy="0">reads</tspan></text>
<rect class="vd-edge-label-bg" x="113.5" y="84" width="58.5" height="26" style="fill:var(--vd-bg,#fff);stroke:none"/>
<text class="vd-edge-label" x="142.5" y="102" text-anchor="middle" style="fill:var(--vd-muted,#57606a);stroke:none"><tspan x="142.5" dy="0">request</tspan></text>
<rect class="vd-edge-label-bg" x="92.5" y="378" width="50.5" height="26" style="fill:var(--vd-bg,#fff);stroke:none"/>
<text class="vd-edge-label" x="117.5" y="396" text-anchor="middle" style="fill:var(--vd-muted,#57606a);stroke:none"><tspan x="117.5" dy="0">export</tspan></text>
</g>
</svg>
