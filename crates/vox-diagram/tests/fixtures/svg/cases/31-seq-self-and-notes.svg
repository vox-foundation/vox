<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1382 496" role="img" aria-labelledby="vd-title vd-desc" class="vd-diagram" style="font-family:var(--vd-font,system-ui,sans-serif);font-size:14px">
<title id="vd-title">Diagram</title>
<desc id="vd-desc">3 actors, 4 messages, 3 notes: First → First; Middle → Middle; Last → Last; Middle → Last</desc>
<defs>
<marker id="vd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0L10 5L0 10z" style="fill:var(--vd-edge,#57606a)"/>
</marker>
</defs>
<g class="vd-lifelines" style="fill:none;stroke:var(--vd-edge,#57606a);stroke-width:1;stroke-dasharray:4 4">
<path class="vd-lifeline" d="M213.5 54L213.5 480"/>
<path class="vd-lifeline" d="M698 54L698 480"/>
<path class="vd-lifeline" d="M893.5 54L893.5 480"/>
</g>
<g class="vd-nodes">
<g class="vd-node">
<rect class="vd-node-shape" x="181.5" y="16" width="64" height="38" rx="3" style="fill:var(--vd-node-fill,#fff);stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<text class="vd-label" x="213.5" y="40" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="213.5" dy="0">First</tspan></text>
</g>
<g class="vd-node">
<rect class="vd-node-shape" x="661.5" y="16" width="73" height="38" rx="3" style="fill:var(--vd-node-fill,#fff);stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<text class="vd-label" x="698" y="40" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="698" dy="0">Middle</tspan></text>
</g>
<g class="vd-node">
<rect class="vd-node-shape" x="861.5" y="16" width="64" height="38" rx="3" style="fill:var(--vd-node-fill,#fff);stroke:var(--vd-node-stroke,#57606a);stroke-width:1.5"/>
<text class="vd-label" x="893.5" y="40" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="893.5" dy="0">Last</tspan></text>
</g>
</g>
<g class="vd-notes">
<rect class="vd-note" x="16" y="236" width="395.5" height="56" rx="3" style="fill:var(--vd-container-fill,#f6f8fa);stroke:var(--vd-container-stroke,#848d97);stroke-width:1.5"/>
<text class="vd-note-label" x="213.5" y="260" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="213.5" dy="0">A note over a single lane with enough text that it has to</tspan><tspan x="213.5" dy="18">wrap onto a second line at sixty cells</tspan></text>
<rect class="vd-note" x="197.5" y="308" width="712" height="56" rx="3" style="fill:var(--vd-container-fill,#f6f8fa);stroke:var(--vd-container-stroke,#848d97);stroke-width:1.5"/>
<text class="vd-note-label" x="553.5" y="332" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="553.5" dy="0">A note spanning the first and the last lane, wide enough to</tspan><tspan x="553.5" dy="18">cover the middle lane as well</tspan></text>
<rect class="vd-note" x="647" y="380" width="297" height="38" rx="3" style="fill:var(--vd-container-fill,#f6f8fa);stroke:var(--vd-container-stroke,#848d97);stroke-width:1.5"/>
<text class="vd-note-label" x="795.5" y="404" text-anchor="middle" style="fill:var(--vd-text,#1f2328);stroke:none"><tspan x="795.5" dy="0">Reversed operands still span both lanes</tspan></text>
</g>
<g class="vd-edges" style="fill:none;stroke:var(--vd-edge,#57606a);stroke-width:1.5">
<path class="vd-edge" d="M213.5 86L243.5 86L243.5 106L213.5 106" marker-end="url(#vd-arrow)"/>
<path class="vd-edge" d="M698 137L728 137L728 157L698 157" marker-end="url(#vd-arrow)"/>
<path class="vd-edge" d="M893.5 188L923.5 188L923.5 208L893.5 208" marker-end="url(#vd-arrow)"/>
<path class="vd-edge" d="M698 464L893.5 464" marker-end="url(#vd-arrow)"/>
</g>
<g class="vd-edge-labels">
<rect class="vd-edge-label-bg" x="249.5" y="74" width="440.5" height="44" style="fill:var(--vd-bg,#fff);stroke:none"/>
<text class="vd-edge-label" x="469.5" y="92" text-anchor="middle" style="fill:var(--vd-muted,#57606a);stroke:none"><tspan x="469.5" dy="0">retry the request up to three times with exponential backoff</tspan><tspan x="469.5" dy="18">and jitter</tspan></text>
<rect class="vd-edge-label-bg" x="734" y="134" width="151.5" height="26" style="fill:var(--vd-bg,#fff);stroke:none"/>
<text class="vd-edge-label" x="809.5" y="152" text-anchor="middle" style="fill:var(--vd-muted,#57606a);stroke:none"><tspan x="809.5" dy="0">validate the payload</tspan></text>
<rect class="vd-edge-label-bg" x="929.5" y="176" width="436.5" height="44" style="fill:var(--vd-bg,#fff);stroke:none"/>
<text class="vd-edge-label" x="1147.5" y="194" text-anchor="middle" style="fill:var(--vd-muted,#57606a);stroke:none"><tspan x="1147.5" dy="0">flush the write-ahead log to disk before acknowledging the</tspan><tspan x="1147.5" dy="18">commit to the caller</tspan></text>
<rect class="vd-edge-label-bg" x="779.5" y="434" width="32" height="26" style="fill:var(--vd-bg,#fff);stroke:none"/>
<text class="vd-edge-label" x="795.5" y="452" text-anchor="middle" style="fill:var(--vd-muted,#57606a);stroke:none"><tspan x="795.5" dy="0">ack</tspan></text>
</g>
</svg>
