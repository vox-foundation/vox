# Mix configuration for vox-lang domain
# Explicit: an empty include_lanes defaults to {vox_codegen} and would drop every row here.
include_lanes: [vox_codegen, vox_docs_qa, vox_lang_tier_b]
output: mens/data/train_mixed_vox_lang.jsonl
sources:
  - path: target/dogfood/vox_corpus_extract.jsonl
    weight: 6.0
    optional: true
  - path: target/dogfood/organic_vox.jsonl
    weight: 3.0
    optional: true
  - path: mens/data/mix_sources/docs.jsonl
    weight: 2.0
    optional: true
  - path: target/dogfood/synthetic.jsonl
    weight: 1.0
    optional: true
  - path: target/dogfood/distillation_traces.jsonl
    weight: 2.0
    optional: true
  # Compiler-verified synthesis (lane vox_codegen). Produced by
  # `vox mens corpus back-translate --apply` / `vox mens corpus rft --apply`
  # (pipeline stages back_translate / rft, opt-in). Weights: back-translated pairs
  # pair human-written, compile-clean code with generated instructions, so they sit
  # just below the primary extract; RFT completions are model-written (verified by
  # the compiler + @test) and weighted lower to limit self-distillation drift.
  - path: mens/data/mix_sources/back_translated.jsonl
    weight: 4.0
    optional: true
  - path: mens/data/mix_sources/rft_vox.jsonl
    weight: 2.0
    optional: true
  - path: target/dogfood/preference_pairs.jsonl
    weight: 3.0
    optional: true
    record_format: dpo
