# Ladder re-gate policy — heldout-focused quality gates.
#
# Use after `eval-local` (and optionally collateral) when promoting a size:
#   vox-ml-cli mens eval-gate --run-dir mens/runs/qwen3-<size> \
#     --policy mens/config/eval-gates-ladder.yaml

pass_at_k:
  min_pass_rate_at_1: 0.25
  # With k=1 smoke runs the checker collapses this to min_pass_rate_at_1.
  min_pass_rate_at_k: 0.50
  max_regression_drop: 0.03
  metrics_file: benchmark_passatk.json
  baseline_file: baseline_passatk.json
  block: true

anti_stub:
  min_pass_rate: 0.92
  max_placeholder_event_rate: 0.08
  max_trivial_placeholder_event_rate: 0.08
  min_construct_richness_mean: 0.125
  block: true

supervised_ratio:
  min_pct: 10.0
  block: false

# Collateral forgetting report (written by mens eval-collateral-damage).
# block: true so ladder receipts match Hub publish requirements.
collateral_damage:
  block: true
  alpha: 0.05
  rule: fixed_n
  sequential:
    looks_fraction: [0.25, 0.5, 0.75, 1.0]
    look_alpha: [0.0005, 0.002, 0.005, 0.04795]
  slices:
