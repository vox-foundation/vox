# Per-size wording and spoke data for the MENS Hub cards (phase 339, spec section 4.3).
#
# Embedded at compile time (crates/vox-populi/src/mens/hub_card/config.rs): edit this file,
# then rebuild. It is validated on load: every ladder size needs a blurb of two or three
# sentences, and no blurb or purpose may contain a digit. Numbers on a card come from run
# records, never from this file; the one exception is `regate_eta`, which is labelled an
# estimate wherever it is shown. Shared explanation lives on the docs page
# docs/src/reference/mens-models.md.
schema: vox_mens_hub_cards_v1

# Declared here because no run record carries training lanes yet. Phase 338 plan 06 replaces
# this line with a derivation from the training mix.
default_spoke: vox-lang
default_spoke_source: >-
  Off-the-shelf models often guess Rust or TypeScript syntax when asked for Vox; Vox Mens models
  specialize in valid Vox code so you can run locally on Windows, Linux, or Mac — or pair them
  underneath a larger cloud model for big-picture planning.

spokes:
  - id: vox-lang
    label: vox-lang
    status: trained
    purpose: Writes, fixes, and explains Vox database tables, backend handlers, web views, and workflows.

sizes:
  "0.8B":
    why:
      - Vox Mens 0.8B is the smallest download in the family, built to run on almost any Windows, Linux, or Mac laptop — even without a dedicated GPU — or in the browser Playground.
      - Use 0.8B to try Vox locally, generate short functions or simple queries, and check basic Vox syntax with minimal memory and disk use.
      - Because 0.8B has very limited capacity for multi-step logic, step up to 2B or 4B for full handlers and use a larger cloud model for app design.
    regate_eta:
      hours_expected: 0.9
      hours_conservative: 1.5
      basis: >-
        Paired collateral evaluation for 0.8B runs 576 new generations (3 slices x 96 new items x 2 sides,
        assuming the 32-item prefix cache) at 5.5 s/item expected and 9.4 s/item conservative, giving
        3168 s = 0.9 h and 5414 s = 1.5 h.
      confidence: low
  "2B":
    why:
      - Vox Mens 2B fits everyday laptops and entry-level GPUs across Windows, Linux, and Mac while keeping memory use light alongside your editor and browser.
      - Use 2B for writing single Vox functions, database table definitions, and small self-contained unit tests.
      - Drop to 0.8B when disk or RAM is tight, or move up to 4B and 9B when a file combines tables, queries, mutations, and UI views.
    regate_eta:
      hours_expected: 1.8
      hours_conservative: 2.8
      basis: >-
        Paired collateral evaluation for 2B runs 576 new generations (3 slices x 96 new items x 2 sides,
        assuming the 32-item prefix cache) at 11 s/item expected and 17 s/item conservative, giving
        6336 s = 1.8 h and 9792 s = 2.8 h.
      confidence: low
  "4B":
    why:
      - Vox Mens 4B is the practical everyday choice for developer PCs and laptops with a modest GPU or comfortable system RAM.
      - Use 4B to draft connected database tables, backend queries and mutations, reactive web components, and routine compiler fixes in one file.
      - Step down to 2B on lighter hardware, step up to 9B or 27B when type errors get trickier, and use large cloud models for open-ended architecture.
    regate_eta:
      hours_expected: 3.6
      hours_conservative: 5.4
      basis: >-
        Paired collateral evaluation for 4B runs 576 new generations (3 slices x 96 new items x 2 sides)
        at 22 s/item expected and 34 s/item conservative, giving 12672 s = 3.5 h and 19584 s = 5.4 h
        excluding model loads.
      confidence: low
  "9B":
    why:
      - Vox Mens 9B targets desktop GPUs, higher-memory laptops, and hosted inference endpoints for stronger multi-function Vox accuracy.
      - Use 9B when writing workflows, state machines, and multi-handler Vox files or fixing compiler errors that smaller local models miss.
      - Choose 4B for faster local turnaround, step up to 27B on heavier GPUs or hosted routers, and keep broad cross-project planning on large cloud models.
    regate_eta:
      hours_expected: 6.2
      hours_conservative: 9.0
      basis: >-
        Paired collateral evaluation for 9B runs 576 new generations (3 slices x 96 new items x 2 sides,
        assuming the 32-item prefix cache) at 39 s/item expected and 56 s/item conservative, giving
        22464 s = 6.2 h and 32256 s = 9.0 h.
      confidence: low
  "27B":
    why:
      - Vox Mens 27B offers the highest Vox accuracy in this open-weights lineup for high-VRAM GPUs, workstations, and hosted routers — though at 27B it is still a compact model compared to massive proprietary cloud APIs.
      - Use 27B when code must stay private on your own hardware or when offloading day-to-day Vox generation and compiler fixes from metered cloud billing.
      - Pair 27B underneath a large cloud model that handles open-ended product specs and research, or step down to 9B and 4B for lighter local runs.
    regate_eta:
      hours_expected: 11.5
      hours_conservative: 16.5
      basis: >-
        Paired collateral evaluation for 27B runs 576 new generations across three reasoning slices at
        72 s/item expected and 103 s/item conservative, giving 41472 s = 11.5 h and 59328 s = 16.5 h
        excluding model load time.
      confidence: low
