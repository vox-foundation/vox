# Per-size wording and spoke data for the MENS Hub cards (phase 339, spec section 4.3).
#
# Embedded at compile time (crates/vox-populi/src/mens/hub_card/config.rs): edit this file,
# then rebuild. It is validated on load: every ladder size needs a blurb of two or three
# sentences, and no blurb or purpose may contain a digit. Numbers on a card come from run
# records, never from this file; the one exception is `regate_eta`, which is labelled an
# estimate wherever it is shown. Shared explanation lives on the docs page
# docs/src/reference/mens-models.md.
schema: vox_mens_hub_cards_v1

# Declared here because no run record carries training lanes yet. Phase 338 plan 06 replaces
# this line with a derivation from the training mix.
default_spoke: vox-lang
default_spoke_source: >-
  Each fine-tuned checkpoint specializes in writing, fixing, and explaining Vox programs, and
  only publishes after automated compiler checks verify it improves Vox code without hurting
  general coding.

spokes:
  - id: vox-lang
    label: vox-lang
    status: trained
    purpose: Helps developers write, fix, and understand Vox web apps, agents, and backend functions.
  - id: tool-selection
    label: "harness: tool-selection"
    status: planned
    purpose: Picks the right external tool or API action next inside automated coding workflows.
    link: https://voxlang.org/reference/mens-models/#hub-and-spoke
  - id: argument-generation
    label: "harness: argument-generation"
    status: planned
    purpose: Fills in structured inputs and parameters cleanly when calling coding tools.
    link: https://voxlang.org/reference/mens-models/#hub-and-spoke
  - id: rust
    label: rust
    status: planned
    purpose: Assists with lower-level Rust crates and runtime bindings alongside Vox apps.
    link: https://voxlang.org/reference/mens-models/#hub-and-spoke

sizes:
  "0.8B":
    why:
      - The ultra-lightweight 0.8B hybrid entry model runs fast on everyday laptops, edge devices, and modest unified memory.
      - Use 0.8B when instant autocomplete, quick syntax questions, and fast continuous checks matter more than deep multi-file reasoning.
      - Step up to 2B or 4B whenever you start editing multiple connected functions across a file.
    regate_eta:
      hours_expected: 0.9
      hours_conservative: 1.5
      basis: >-
        Paired collateral evaluation for 0.8B runs 576 new generations (3 slices x 96 new items x 2 sides,
        assuming the 32-item prefix cache) at 5.5 s/item expected and 9.4 s/item conservative, giving
        3168 s = 0.9 h and 5414 s = 1.5 h.
      confidence: low
  "2B":
    why:
      - The compact 2B hybrid model fits comfortably on everyday developer laptops and modest desktop GPUs with limited unified memory.
      - Pick 2B for single-file Vox endpoints, quick schema drafts, beginner Q&A, and one-pass compiler error fixes.
      - Move down to 0.8B for tighter latency on small hardware, or step up to 4B when changes span several files.
    regate_eta:
      hours_expected: 1.8
      hours_conservative: 2.8
      basis: >-
        Paired collateral evaluation for 2B runs 576 new generations (3 slices x 96 new items x 2 sides,
        assuming the 32-item prefix cache) at 11 s/item expected and 17 s/item conservative, giving
        6336 s = 1.8 h and 9792 s = 2.8 h.
      confidence: low
  "4B":
    why:
      - The balanced 4B hybrid model is built for workstation laptops with comfortable unified memory and steady local decode speed.
      - Choose 4B as your daily coding assistant for building full Vox routes, reactive components, and refactoring connected helpers together.
      - Step up to 9B for complex cross-module tasks, or switch to 2B on lighter machines.
    regate_eta:
      hours_expected: 3.6
      hours_conservative: 5.4
      basis: >-
        Paired collateral evaluation for 4B runs 576 new generations (3 slices x 96 new items x 2 sides)
        at 22 s/item expected and 34 s/item conservative, giving 12672 s = 3.5 h and 19584 s = 5.4 h
        excluding model loads.
      confidence: low
  "9B":
    why:
      - The capable 9B hybrid model targets high-memory developer laptops and compact Apple Silicon studios running locally.
      - Use 9B when planning multi-file features, wiring database schemas to actors, and reasoning carefully through compiler types.
      - Step back to 4B on smaller machines, or step up to 27B for whole-repository architecture work.
    regate_eta:
      hours_expected: 6.2
      hours_conservative: 9.0
      basis: >-
        Paired collateral evaluation for 9B runs 576 new generations (3 slices x 96 new items x 2 sides,
        assuming the 32-item prefix cache) at 39 s/item expected and 56 s/item conservative, giving
        22464 s = 6.2 h and 32256 s = 9.0 h.
      confidence: low
  "27B":
    why:
      - The flagship 27B studio model is designed for high-memory Apple Silicon workstations without needing a remote server cluster.
      - Pick 27B for deep cross-module architecture design, complex multi-file Vox synthesis, and challenging debugging in one pass.
      - Drop down to 9B whenever workstation memory headroom or token speed runs tight.
    regate_eta:
      hours_expected: 11.5
      hours_conservative: 16.5
      basis: >-
        Paired collateral evaluation for 27B runs 576 new generations across three reasoning slices at
        72 s/item expected and 103 s/item conservative, giving 41472 s = 11.5 h and 59328 s = 16.5 h
        excluding model load time.
      confidence: low
