# Mix configuration for rust-expert domain
# Raw mens/data/mix_sources/rust_source.jsonl (19,664 lines) is tagged
# `lane: rust_context`, which was never in include_lanes below — every row
# was silently filtered (skipped_reason: no_lines_passed_filters). It also
# carries 65 rows using retired @query/@mutation/@component decorator
# spellings (hard parse errors since 2026-06-30). Rather than widening
# include_lanes to admit the raw, unpurged lane, `vox run
# scripts/mens-corpus/build_rust_authoring_corpus.vox` derives the required
# rust_authoring.validated.jsonl below by purging those rows and relabeling
# the survivors `lane: vox_rust_authoring` (already in include_lanes).
output: mens/data/train_mixed_rust.jsonl
include_lanes: [vox_rust_expert_cross, vox_rust_authoring, vox_rust_review]
sources:
  - path: target/dogfood/rust_pairs.validated.jsonl
    weight: 4.0
    optional: true
  - path: target/dogfood/vox_rust_expert_cross.jsonl
    weight: 3.0                   # Cross-domain verified Rust↔Vox (MINE / Wave 2)
    optional: true
  - path: target/dogfood/vox_corpus_extract_pkg.jsonl
    weight: 2.0                   # Human-mined workspace code (breadth)
    optional: true
  - path: target/dogfood/rust_authoring.validated.jsonl
    weight: 3.0
    optional: false   # strict: this spoke needs real authoring data
  - path: mens/data/mix_sources/rust_review_dpo.jsonl
    weight: 2.0
    optional: true
