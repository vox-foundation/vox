# Workspace training contract (optional). A `train_path` here would override
# `<data-dir>/train.jsonl` for EVERY run, including an explicit `--data-dir`,
# so none is set. File roles:
#   target/dogfood/train.jsonl        pairs (`vox mens corpus pairs`)
#   target/dogfood/train_mixed.jsonl  mix output (mix.yaml `output:`); the trainer
#                                     reads it automatically when the mix ran.
# For a per-run override, put a training_contract.yaml inside that --data-dir.
#
# Advisory note only: current Rust preflight does not automatically apply
# `context_filter`. Use CLI/config wiring that explicitly passes a context
# filter when you need one.
context_filter: vox_source
