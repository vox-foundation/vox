# Mix configuration for agents domain
include_lanes: [vox_tooling, vox_tool_selection, vox_argument_generation, vox_codegen]
output: mens/data/train_mixed_agents.jsonl
sources:
  - path: mens/data/mix_sources/dogfood_converted.jsonl
    weight: 5.0
    optional: true
  - path: target/dogfood/a2a_traces.jsonl
    weight: 4.0
    optional: true
  - path: mens/data/mix_sources/autofeedback.jsonl
    weight: 3.0
    optional: true
  - path: target/dogfood/multi_turn.jsonl
    weight: 3.0
    optional: true
  - path: mens/data/mix_sources/attention_dogfood.jsonl
    weight: 5.0
    optional: true
  - path: target/dogfood/workflow_traces.jsonl
    weight: 2.0
    record_format: workflow_trace
    optional: true
  - path: mens/data/mix_sources/agent_traces.jsonl
    weight: 4.0
    record_format: tool_trace
    optional: true
  - path: mens/data/mix_sources/gsd_workflows.jsonl
    weight: 4.0
    optional: true
    record_format: gsd_workflow
