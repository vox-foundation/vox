# CodeRabbit configuration
# Schema: https://docs.coderabbit.ai/reference/configuration
#
# Disabled codebase-wide (2026-10-12): CodeRabbit free tier limits PRs to 100 files
# (which monorepo PRs regularly exceed), requires paid credits for autofix, and
# posts noisy comments when triggered.

reviews:
  review_status: false
  auto_review:
    enabled: false
    drafts: false
    auto_incremental_review: false
  finishing_touches:
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

chat:
  auto_reply: false
