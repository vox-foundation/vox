name: install-linux-system-deps
description: >-
  Install Linux GTK/wry/keyring system packages for Rust builds. Hardens
  `apt-get update` against third-party repo flakes that ship on GitHub-hosted
  ubuntu images (notably google-chrome Hash Sum mismatch) and on shared
  self-hosted runners (nodesource, etc.). Packages themselves come from the
  official Ubuntu archive.

inputs:
  extra-packages:
    description: >-
      Extra space-separated apt packages beyond the default GTK/wry set
      (e.g. "libasound2-dev").
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: apt-get install GTK/wry system deps
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        set -euo pipefail
        if [[ "${RUNNER_OS:-}" != "Linux" ]]; then
          echo "Skipping install-linux-system-deps on ${RUNNER_OS:-unknown}"
          exit 0
        fi

        pkgs=(
          libdbus-1-dev
          pkg-config
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev
        )
        # Allowlist-parse extras from env (never interpolate into the script body).
        if [[ -n "${EXTRA_PACKAGES}" ]]; then
          # Keep the regex in a variable — an unescaped space inside `[[ =~ ]]`
          # is a bash syntax error ("syntax error in conditional expression").
          _extra_re='^[a-zA-Z0-9.+ -]*$'
          if [[ ! "${EXTRA_PACKAGES}" =~ ${_extra_re} ]]; then
            echo "::error::extra-packages contains disallowed characters: ${EXTRA_PACKAGES}"
            exit 1
          fi
          # shellcheck disable=SC2206
          extra=(${EXTRA_PACKAGES})
          if ((${#extra[@]})); then
            pkgs+=("${extra[@]}")
          fi
        fi

        # GitHub ubuntu-latest images often ship /etc/apt/sources.list.d/google-chrome.list.
        # When that mirror races, `apt-get update` fails with Hash Sum mismatch and
        # aborts the whole step even though we never install chrome from that repo.
        # Same class of flake: nodesource / microsoft-prod on shared self-hosted hosts.
        # Deb822 *.sources names are disabled alongside classic *.list.
        disable_flaky_apt_lists() {
          shopt -s nullglob
          local f
          for f in \
            /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google-chrome*.sources \
            /etc/apt/sources.list.d/nodesource*.list \
            /etc/apt/sources.list.d/nodesource*.sources \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/microsoft-prod.sources
          do
            echo "::warning::Disabling flaky apt source: $f"
            sudo mv "$f" "${f}.disabled-by-vox-ci" || sudo rm -f "$f" || true
          done
          shopt -u nullglob
        }

        disable_flaky_apt_lists
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*

        # Bound every network phase. An unbounded `apt-get install` once sat at
        # ~56 kB/s on azure.archive.ubuntu.com for 17+ min (59 MB), which alone ate
        # the 30-min job cap on every PR. `Timeout` only catches a dead socket, not
        # a trickle, so the install is also wrapped in `timeout` and falls back to
        # a different mirror host. Partial downloads are kept in the apt archive
        # cache, so the retry resumes instead of starting over.
        apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)

        if ! sudo timeout 180 apt-get update -y "${apt_opts[@]}"; then
          echo "::warning::apt-get update failed after disabling known flaky lists; retrying once"
          disable_flaky_apt_lists
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo timeout 180 apt-get update -y "${apt_opts[@]}"
        fi

        if ! sudo timeout 300 apt-get install -y "${apt_opts[@]}" "${pkgs[@]}"; then
          echo "::warning::apt-get install exceeded 5 min or failed (throttled mirror?); retrying via archive.ubuntu.com"
          sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' \
            -e 's#http://azure\.archive\.ubuntu\.com/ubuntu/\?#http://archive.ubuntu.com/ubuntu/#g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo timeout 180 apt-get update -y "${apt_opts[@]}"
          sudo timeout 600 apt-get install -y "${apt_opts[@]}" "${pkgs[@]}"
        fi
