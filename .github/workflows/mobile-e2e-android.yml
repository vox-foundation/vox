name: Mobile E2E - Android
# Heavy GitHub-hosted macOS job. Not on pull_request/merge_group: android-e2e's
# 45m timeout exceeds the fast-lane (PR/merge_group) 30-min cap
# (workflow_policy_guard). Runs nightly instead, mirroring mobile-e2e-ios's
# earlier move off push/PR for the same class of heavy macOS job.
on:
  schedule:
    - cron: '0 3 * * *' # Nightly, alongside mobile-e2e-ios
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  android-e2e:
    # Nothing here needs macOS or the Android SDK (codegen only). macos-15-intel was a
    # slow x86_64 runner whose cache key (no arch) restored the arm64 macOS target, so
    # every run was a 43+ min cold build that hit the timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (libdbus/GTK/WebKit)
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: ./.github/actions/setup-rust
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: apps/vox-mental-tracker/pnpm-lock.yaml
      - name: Install dependencies
        run: cd apps/vox-mental-tracker && pnpm install --frozen-lockfile
      - name: Build vox CLI
        run: cargo build -p vox-cli
      # No separate `pnpm build` (a second, unused release compile of vox-cli), and no
      # Playwright here: the same `pnpm e2e` suite runs in vox-mental-tracker.yml's
      # playwright job, with browsers installed. Codegen needs tauri-cli.
      - name: Install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Tauri mobile codegen (Android)
        run: |
          cd apps/vox-mental-tracker
          ../../target/debug/vox compile --target mobile-android -o dist src/main.vox
      # Codegen writes next to the app's Vox.toml, not under the repo root.
      - name: Verify generated Tauri workspace
        run: test -f apps/vox-mental-tracker/target/generated/src-tauri/tauri.conf.json
