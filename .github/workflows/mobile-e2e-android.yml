name: Mobile E2E - Android
# Heavy GitHub-hosted macOS job. Not on pull_request/merge_group: android-e2e's
# 45m timeout exceeds the fast-lane (PR/merge_group) 30-min cap
# (workflow_policy_guard). Runs nightly instead, mirroring mobile-e2e-ios's
# earlier move off push/PR for the same class of heavy macOS job.
on:
  schedule:
    - cron: '0 3 * * *' # Nightly, alongside mobile-e2e-ios
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  android-e2e:
    # Tier: heavy (GitHub-hosted macOS).
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: apps/vox-mental-tracker/pnpm-lock.yaml
      - name: Install dependencies
        run: cd apps/vox-mental-tracker && pnpm install --frozen-lockfile
      - name: Build vox CLI
        run: cargo build -p vox-cli
      - name: Build web bundle
        run: cd apps/vox-mental-tracker && pnpm build
      - name: Tauri mobile codegen (Android)
        run: |
          cd apps/vox-mental-tracker
          ../../target/debug/vox compile --target mobile-android -o dist src/main.vox
      - name: Verify generated Tauri workspace
        run: test -f target/generated/src-tauri/tauri.conf.json
      - name: Run Playwright (web)
        run: cd apps/vox-mental-tracker && pnpm e2e
