name: Cross-Platform Check (Windows + macOS + Ubuntu)
on:
  # Not on pull_request/merge_group: the full Win/macOS/Ubuntu matrix (cross-check
  # 90m, standalone-installables 60m) exceeds the fast-lane (PR/merge_group)
  # 30-min cap (workflow_policy_guard). Runs on the weekly schedule instead.
  schedule:
    - cron: '0 4 * * 1'   # Weekly Monday belt-and-suspenders run (full Win/macOS)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  cross-check:
    name: Cross-Platform (Win/macOS/Ubuntu)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sccache_gha: "true"
          - os: macos-latest
            target: aarch64-apple-darwin
            sccache_gha: "true"
          # GHA sccache backend ON — actions/cache doesn't cache SCCACHE_DIR.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sccache_gha: "true"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: ${{ matrix.sccache_gha }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Install system deps (Linux — GTK/wry required)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-system-deps

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Cheap first signal: prove the whole workspace COMPILES on every OS.
      # vox-gui is a Tauri bin needing the pnpm-built ui/dist at compile time, so
      # it is excluded here and covered separately (Phase 5 / release-gui.yml).
      - name: cargo check (workspace)
        run: cargo check --workspace --exclude vox-gui --target ${{ matrix.target }}

      # Cheap test signal: only the platform-sensitive crates.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: nextest (platform-sensitive crates)
        run: |
          cargo nextest run -p vox-config
          cargo nextest run -p vox-config --features llm-egress
          cargo nextest run -p vox-cli-core
          cargo nextest run -p vox-populi --lib

      # Full depth: the weekly Win/macOS/Ubuntu sweep this workflow exists for.
      - name: clippy (workspace, -D warnings)
        run: cargo clippy --workspace --exclude vox-gui --target ${{ matrix.target }} -- -D warnings

      - name: nextest (workspace)
        run: cargo nextest run --workspace --exclude vox-gui

      - name: sccache stats
        if: always()
        run: sccache --show-stats
      # Portability report (os_compat.py) removed from the per-merge path — the weekly
      # os-compat-report.yml is the canonical portability scan.

  # The `cross-check` job above builds with `--workspace`, which unifies Cargo
  # features across the entire graph — so a crate that under-declares a feature
  # still compiles there. `vox-gamify` used `vox_db::paths` (gated behind vox-db's
  # `host-integration`) without enabling it, and only broke when built from a graph
  # that excludes vox-cli: `cargo install --path crates/vox-ml-cli` failed on a
  # fresh macOS clone while all of CI stayed green.
  #
  # Build the installable leaf binaries STANDALONE (`-p`, no `--workspace`) so
  # feature unification cannot mask an under-declared dependency again.
  standalone-installables:
    name: Standalone installable crates (no feature unification)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Install system deps (Linux — GTK/wry required)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-system-deps

      # `-p` with no `--workspace`: each is a separate feature resolution, which is
      # what `cargo install --path` does. `--all-targets` because plain `cargo check`
      # skips tests and benches, where feature-gated code also rots.
      - name: cargo check (standalone, per-crate)
        shell: bash
        run: |
          set -euo pipefail
          cargo check --all-targets -p vox-ml-cli
          cargo check --all-targets -p vox-ml-cli --features populi
          cargo check --all-targets -p vox-gamify
          cargo check --all-targets -p vox-orchestrator-d
          # Installed by `vox plugin install`; both under-declared
          # vox-db/host-integration and compiled only under feature unification.
          cargo check --all-targets -p vox-plugin-mens-candle-metal
          cargo check --all-targets -p vox-plugin-mens-candle-cuda

      # NOTE: the vox-gui asset guards deliberately do NOT run here. Compiling any
      # vox-gui target runs tauri-build, which embeds the gitignored `ui/dist` — it
      # does not exist on a fresh checkout without a pnpm build, which is why the
      # workspace check above excludes vox-gui too. Those guards live in
      # gui-cross-build.yml, after its frontend build step.

  # Single stable context for branch protection. `cross-check` and
  # `standalone-installables` are matrix jobs whose GitHub-reported context
  # names embed the OS/target/sccache-flag tuple (e.g. "Cross-Platform
  # (Win/macOS/Ubuntu) (windows-latest, x86_64-pc-windows-msvc, true)") — those
  # names change whenever a leg is added, renamed, or re-flagged, so they can
  # never be required without branch protection silently going stale. This
  # job's `name:` is a fixed string with no matrix interpolation, so it is the
  # only context that should ever be marked required for this workflow.
  #
  # `if: always()` + explicit success-or-skipped check (mirrors ci.yml's
  # `ci-summary`) so this job runs — and reports correctly — even when a leg
  # genuinely failed.
  cross-platform-summary:
    name: Cross-Platform Check
    needs: [cross-check, standalone-installables]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All needed jobs succeeded or were skipped
        run: |
          set -euo pipefail
          fail=0
          for r in \
            "${{ needs.cross-check.result }}" \
            "${{ needs.standalone-installables.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::a needed job did not succeed (result: $r)"
              fail=1
            fi
          done
          exit $fail
