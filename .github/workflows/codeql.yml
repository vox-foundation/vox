# CodeQL
#
# Static security analysis for Rust and JavaScript/TypeScript.
#
# Rust CodeQL support is GA and build-mode none: the extractor does its own traceless
# extraction, so this job runs no build of its own.
# If GitHub's "default setup" for CodeQL is enabled on this repo it can conflict
# with this advanced (workflow-defined) setup; disable the default setup under
# Settings -> Security -> Code scanning if you see duplicate or failing analyses.
name: "CodeQL"

on:
  # Off per-PR and off merge_group: CodeQL's Rust extractor is a ~60-min
  # analysis, which exceeds the fast-lane (PR/merge_group) 30-min cap
  # (workflow_policy_guard) and OOMs on large PR diff-ranges anyway.
  # Coverage is the weekly schedule below — the per-PR critical path keeps
  # its fast signal instead.
  schedule:
    # Weekly, Monday 04:30 UTC.
    - cron: "30 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # GitHub-hosted (16 GB) by policy: CodeQL is a neutral-infra security scan
    # (compute-placement.md §vox placement), and the Rust extractor's PR diff-range
    # analysis OOMs in the self-hosted job container (capped ~4 GB, exit 99).
    runs-on: ubuntu-latest
    # Rust extraction alone measured ~40 min cold (it recompiles build scripts and
    # proc-macros in its own scratch target); 60 cut it off even without the old
    # wasted cargo build. Weekly scheduled job; slow-lane cap is 180.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # build-mode: none for both languages. CodeQL's Rust extractor does not trace a
      # build (it runs its own traceless extraction in a scratch target dir), so the
      # explicit `cargo build` this job used to run was 16-23 min of pure waste that
      # pushed every run since 2026-08-31 past the 60-min timeout.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Cache Rust build
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@v2

      # The extractor's own cargo still runs build scripts, which pull system libraries:
      #   - `libdbus-sys` (keyring / secret-service, default `keyring-store` feature)
      #   - the GTK/WebKit stack (`webkit2gtk-sys`, `gtk`, `gdk`, …) from the
      #     Tauri GUI backend.
      # ubuntu-latest ships only the runtimes, not the `-dev` headers pkg-config
      # needs, so the build scripts fail without these. The WebKit/GTK set mirrors
      # `release-gui.yml`; other CI lanes run on images that already include them.
      - name: Install system dependencies (rust)
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
