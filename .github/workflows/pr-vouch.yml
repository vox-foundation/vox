# Label PRs by author trust (t3code pr-vouch.yml adapted for Vox).
name: PR Vouch

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created]
  push:
    branches:
      - main
    paths:
      - .github/VOUCHED.td
      - .github/workflows/pr-vouch.yml

concurrency:
  group: pr-vouch-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  collect-targets:
    name: Collect PR targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.collect.outputs.targets }}
    steps:
      - id: collect
        name: Collect PR targets
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === "pull_request_target") {
              const pr = context.payload.pull_request;
              core.setOutput("targets", JSON.stringify([{ number: pr.number, user: pr.user.login }]));
              return;
            }
            if (context.eventName === "issue_comment") {
              const issue = context.payload.issue;
              const body = context.payload.comment?.body ?? "";
              if (!issue?.pull_request || !body.includes("/recheck-vouch")) {
                core.setOutput("targets", "[]");
                return;
              }
              core.setOutput(
                "targets",
                JSON.stringify([{ number: issue.number, user: issue.user.login }]),
              );
              return;
            }
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            core.setOutput(
              "targets",
              JSON.stringify(pulls.map((pull) => ({ number: pull.number, user: pull.user.login }))),
            );

  label:
    name: Label PR ${{ matrix.target.number }}
    needs: collect-targets
    if: ${{ needs.collect-targets.outputs.targets != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pr-vouch-${{ matrix.target.number }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.collect-targets.outputs.targets) }}
    steps:
      - name: Checkout VOUCHED list (base only)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/VOUCHED.td
            .github/workflows

      - id: vouch
        name: Check PR author trust
        uses: mitchellh/vouch/action/check-user@v1
        with:
          user: ${{ matrix.target.user }}
          allow-fail: true
          vouched-file: .github/VOUCHED.td
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync PR labels
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ matrix.target.number }}
          VOUCH_STATUS: ${{ steps.vouch.outputs.status }}
        with:
          script: |
            const issueNumber = Number(process.env.PR_NUMBER);
            const status = process.env.VOUCH_STATUS;
            const managedLabels = [
              { name: "vouch:trusted", color: "1f883d", description: "PR author is trusted by repo permissions or the VOUCHED list." },
              { name: "vouch:unvouched", color: "fbca04", description: "PR author is not yet trusted in the VOUCHED list." },
              { name: "vouch:denounced", color: "d1242f", description: "PR author is explicitly blocked by the VOUCHED list." },
            ];
            const managedLabelNames = new Set(managedLabels.map((l) => l.name));
            for (const label of managedLabels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner, repo: context.repo.repo,
                    name: label.name, color: label.color, description: label.description,
                  });
                } else { throw error; }
              }
            }
            const nextLabelName =
              status === "denounced" ? "vouch:denounced"
              : ["bot", "collaborator", "vouched"].includes(status) ? "vouch:trusted"
              : "vouch:unvouched";
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100,
            });
            for (const label of currentLabels) {
              if (!managedLabelNames.has(label.name) || label.name === nextLabelName) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issueNumber, name: label.name,
                });
              } catch (e) { if (e.status !== 404) throw e; }
            }
            if (!currentLabels.some((l) => l.name === nextLabelName)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber, labels: [nextLabelName],
              });
            }
            core.info(`PR #${issueNumber}: ${status} -> ${nextLabelName}`);
