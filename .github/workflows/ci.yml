# PR / merge-queue gate. Hosted, ≤30 min (workflow_policy_guard enforces the cap).
# Slow lanes live in nightly.yml. Run the heavy leg locally in Docker:
#   act pull_request -j linux
# `gate` is a thin aggregator that owns the branch-protection required context.
name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: Linux (fmt, guards, clippy, tests — affected)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Start budget clock
        shell: bash
        run: echo "GATE_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-linux-system-deps
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          cache: "false"   # Swatinem below is the only Rust cache; PRs never write it
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false   # nightly.yml on main is the only writer (default-branch caches are shared)
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - name: Build vox CLI
        run: cargo build -p vox-cli --locked

      - name: Fast tier (same checks as local `vox ci pre-push`)
        run: ./target/debug/vox ci pre-push

      - name: Affected crates
        id: affected
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          [ -n "$BASE_SHA" ] || { echo "::error::no base SHA"; exit 1; }
          git diff --name-only "$BASE_SHA...HEAD" > /tmp/changed.txt
          if ! grep -qE '^(crates/|Cargo\.(toml|lock)|\.cargo/|rust-toolchain\.toml|contracts/|\.config/|examples/|\.github/workflows/)' /tmp/changed.txt; then
            echo "No Rust changes — clippy/tests skipped."
            echo "p_args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./target/debug/vox ci affected-crates --changed /tmp/changed.txt \
            --graph contracts/ci/crate-graph.v1.json --github-output /tmp/affected.out
          full=$(grep -E '^full=' /tmp/affected.out | tail -1 | cut -d= -f2 || true)
          args=$(grep -E '^affected_p_args=' /tmp/affected.out | tail -1 | cut -d= -f2- || true)
          # Fail closed: anything but an explicit non-empty affected set → whole workspace.
          if [ "$full" != "false" ] || [ -z "$(echo "$args" | xargs)" ]; then
            args="--workspace --exclude vox-gui"
          fi
          # vox-gui needs ui/dist + the release sidecar (tauri-build); it is covered by nightly.
          args=$(echo "$args" | sed 's/-p vox-gui//g' | xargs)
          echo "p_args=$args" >> "$GITHUB_OUTPUT"
          echo "### Affected: \`$args\`" >> "$GITHUB_STEP_SUMMARY"

      # A toolchain bump brings a wave of new clippy/rustdoc lints that a warm
      # clippy cache hides. On such a PR we run clippy + rustdoc `-D warnings`
      # and skip nextest (nightly runs the suite after merge) to stay in budget.
      - name: Toolchain bump?
        id: bump
        shell: bash
        run: |
          if grep -qx 'rust-toolchain.toml' /tmp/changed.txt; then
            echo "toolchain=true" >> "$GITHUB_OUTPUT"
          else
            echo "toolchain=false" >> "$GITHUB_OUTPUT"
          fi

      # Advisories are date-dependent (a clean PR can go red overnight with no
      # code change), so they stay nightly-only; licenses/bans/sources are
      # deterministic for a given lockfile and belong in the required leg.
      - name: cargo-deny licenses/bans/sources (dependency changes only)
        shell: bash
        run: |
          if grep -qE '(^|/)Cargo\.(toml|lock)$|^deny\.toml$' /tmp/changed.txt; then
            cargo deny check licenses bans sources
          else
            echo "no dependency changes"
          fi

      - name: Clippy (affected)
        if: steps.affected.outputs.p_args != ''
        run: cargo clippy ${{ steps.affected.outputs.p_args }} --all-targets --locked -- -D warnings

      - name: Rustdoc -D warnings (toolchain bump)
        if: steps.bump.outputs.toolchain == 'true'
        run: cargo doc --workspace --exclude vox-gui --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Tests (affected)
        if: steps.affected.outputs.p_args != '' && steps.bump.outputs.toolchain != 'true'
        run: cargo nextest run ${{ steps.affected.outputs.p_args }} --profile ci --locked --no-tests=pass

      - name: Warn when the leg nears its 30-min cap
        if: always()
        shell: bash
        run: |
          mins=$(( ($(date +%s) - GATE_START) / 60 ))
          echo "linux leg ran ${mins} min"
          if [ "$mins" -ge 24 ]; then
            echo "::warning::linux leg took ${mins} min (>80% of the 30-min cap) — cache, shard, or move work to nightly.yml"
          fi

  ui:
    name: GUI UI (typecheck, vitest, Playwright — runs only when crates/vox-gui changes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Start budget clock
        shell: bash
        run: echo "GATE_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: UI changed?
        id: ui
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # Fail closed: an empty base or a git error runs the UI tests.
          # The orch_daemon file is listed because a vitest reads it.
          if [ -n "$BASE_SHA" ] && git diff --name-only "$BASE_SHA...HEAD" > /tmp/changed.txt \
             && ! grep -qE '^crates/vox-gui/|^crates/vox-orchestrator/src/orch_daemon/mod\.rs$' /tmp/changed.txt; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.ui.outputs.run == 'true'
        with:
          version: 11
      - uses: actions/setup-node@v7
        if: steps.ui.outputs.run == 'true'
        with:
          node-version: '24'
          package-manager-cache: false   # no PR-scoped cache writes (cache is at 9.8/10 GB)
      # Only chromium is installed, so we select it explicitly: a bare
      # `pnpm test:e2e` would also select the firefox-review project.
      - name: Install, typecheck, vitest, Playwright
        if: steps.ui.outputs.run == 'true'
        working-directory: crates/vox-gui/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm exec playwright install --with-deps chromium
          # Bounded: the suite takes ~3 min, and on the hosted runner the process was
          # once seen to outlive its last test until the 30-min job cap. If it overruns,
          # fail fast and show what is still alive instead of burning the whole cap.
          if ! DEBUG=pw:webserver timeout --foreground -k 15s 12m pnpm exec playwright test --project=chromium; then
            rc=$?
            echo "::error::playwright exited ${rc} (124 = still running after 12 min)"
            ps -eo pid,ppid,pgid,etime,stat,args --forest | cut -c1-200
            exit "$rc"
          fi

      - name: Warn when the leg nears its 30-min cap
        if: always()
        shell: bash
        run: |
          mins=$(( ($(date +%s) - GATE_START) / 60 ))
          echo "ui leg ran ${mins} min"
          if [ "$mins" -ge 24 ]; then
            echo "::warning::ui leg took ${mins} min (>80% of the 30-min cap) — cache, shard, or move work to nightly.yml"
          fi

  windows:
    # Warn-only until a seeded run proves it fits within the cap;
    # deliberately NOT in gate.needs.
    name: Windows compile check (merge queue, advisory)
    if: github.event_name == 'merge_group'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-windows
          save-if: false   # nightly.yml windows-cache-seed on main is the only writer
      - run: cargo check --workspace --exclude vox-gui --all-targets --locked

  gate:
    # Branch-protection required context — do not rename (required_context_guard).
    name: Check, Build, and Test (Rust)
    needs: [linux, ui]
    if: always()   # must still run (and fail) on a cancelled dep — a skipped gate satisfies branch protection's required-context check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: linux and ui must both succeed
        shell: bash
        env:
          LINUX: ${{ needs.linux.result }}
          UI: ${{ needs.ui.result }}
        run: |
          [ "$LINUX" = success ] || { echo "::error::linux=$LINUX"; exit 1; }
          [ "$UI" = success ] || { echo "::error::ui=$UI"; exit 1; }

  # SSOT auto-regenerate (PR helper, NON-required): regenerate the committed SSOT
  # artifacts that guards-fast → `vox ci ssot-drift` verifies, and commit the result back
  # to the PR branch. Removes the manual "regenerate after merge" round-trip — instead of
  # ssot-drift hard-failing and a human running `vox ci <gen> --write` + committing, the bot
  # does it. The generators are DETERMINISTIC (verified locally: a second run yields byte-
  # identical output), so a re-run produces no diff → no commit → the loop self-terminates
  # after at most one regen commit. Nothing `needs:` this job, so it can never block the
  # required "Check, Build, and Test (Rust)" gate. Builds its own vox-cli (no `setup` job
  # here to share an artifact with — the heavy Rust leg is `linux`, which builds its own).
  #
  # DEPLOYMENT PREREQUISITE: set repo secret `SSOT_AUTOREGEN_TOKEN` to a PAT or GitHub App
  # token with `contents: write`. The default GITHUB_TOKEN can push but its pushes do NOT
  # re-trigger workflows, so the required gate would not re-run on the bot's commit (PR would
  # be unmergeable). With the PAT, the bot's push starts a fresh CI run that re-verifies the
  # regenerated files. Without the secret it falls back to GITHUB_TOKEN: the bot still
  # regenerates + commits, but a maintainer must nudge the gate (e.g. close/reopen the PR).
  ssot-autoregen:
    name: SSOT auto-regenerate (PR)
    # Same-repo PRs only — fork PRs get a read-only token and fall back to manual regen.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30   # cold build of vox-cli; 15 is too tight on a hosted runner
    permissions:
      contents: write   # job-scoped override (workflow default is contents: read) to push the regen commit
    steps:
      # Pinned to immutable SHAs because this job has `contents: write` (tags can be
      # re-pointed after creation). SHAs verified equal to v6 / v4 at PR time. The rest of
      # ci.yml intentionally uses tag refs per repo convention — only this privileged job is
      # hardened. persist-credentials:false avoids leaving the clone token in .git/config;
      # the push step below authenticates explicitly via PUSH_TOKEN.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-linux-system-deps
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace
          save-if: false
      - name: Build vox CLI
        # Same build the linux gate verifies with (ci_workflow_contract pins it).
        run: cargo build -p vox-cli --locked
      - name: Regenerate committed SSOT artifacts
        shell: bash
        run: |
          set -uo pipefail
          # SOURCE OF TRUTH for this list: run_ssot_drift() in
          # crates/vox-cli/src/commands/ci/run_body_helpers/docs.rs — each generator it
          # verifies in read-only mode is re-run here with its --write flag. Keep in sync
          # when that function gains/loses a generator.
          VOX=./target/debug/vox
          for cmd in \
            "operations-sync --target all --write" \
            "command-sync --write" \
            "generate-plugin-catalog-docs" \
            "plugin-catalog-sync --write" \
            "plugin-surface-sync --write" \
            "plugin-skill-parity --write" \
            "gui-version-sync --write" \
            "capability-sync --write" \
            "gui-surface-coverage --write" \
            "gui-surface-registry --write" \
            "affected-crates --regen --out contracts/ci/crate-graph.v1.json"; do
            echo "::group::vox ci $cmd"
            # Best-effort: a generator that errors (not just rewrites) is surfaced as a
            # warning but does not fail the job — the ssot-drift gate still verifies it.
            # $cmd is deliberately unquoted so its words split into subcommand + flags.
            # shellcheck disable=SC2086
            $VOX --quiet ci $cmd || echo "::warning::regenerator failed: vox ci $cmd"
            echo "::endgroup::"
          done
      - name: Commit regenerated artifacts to the PR branch (only if drift)
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          # PAT (preferred) makes the push re-trigger CI; github.token is the fallback.
          # Passed via env (not inline ${{ }}) to avoid expression injection in the run block.
          PUSH_TOKEN: ${{ secrets.SSOT_AUTOREGEN_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "SSOT artifacts already fresh — nothing to commit."
            exit 0
          fi
          echo "Regeneration changed:"; git diff --name-only
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # NO [skip ci]: the regenerated commit must be re-verified by the gate. The
          # generators are deterministic, so the re-triggered run regenerates identically,
          # finds no diff, and does not commit again — the loop terminates.
          git commit -m "chore(ssot): auto-regenerate drifted SSOT artifacts (deterministic; ci.yml ssot-autoregen)"
          # Explicit one-shot HTTPS token auth (checkout used persist-credentials:false, so no
          # credentials linger in .git/config for later steps). GITHUB_REPOSITORY is set by Actions.
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${PR_HEAD_REF}"
