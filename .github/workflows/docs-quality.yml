name: Docs Quality

on:
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'contracts/**'
      - 'crates/vox-doc-pipeline/**'
      - 'crates/vox-cli/src/commands/ci/**'
      - 'docs-astro/**'
      - '.git-blame-ignore-revs'
      - '.lycheeignore'
      - '.github/workflows/docs-quality.yml'
      # 20-09: repo Markdown mounted at /repo/<route>/ (contracts/documentation/site-mounted-repo-docs.v1.json)
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'LANGUAGE_DESIGN_PRIORITIES.md'
      - '.github/copilot-instructions.md'
      - 'apps/editor/vox-vscode/README.md'
      - 'crates/**/README.md'
      - 'examples/PARSE_STATUS.md'
      - 'examples/STYLE.md'
      - 'examples/compile-suite/README.md'
      - 'scripts/README.md'
      - 'scripts/coverage-graph/README.md'
      - 'scripts/show/README.md'
      - 'tree-sitter-vox/GRAMMAR_SSOT.md'
      - 'tree-sitter-vox/README.md'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'contracts/**'
      - 'crates/vox-doc-pipeline/**'
      - 'crates/vox-cli/src/commands/ci/**'
      - 'docs-astro/**'
      - '.git-blame-ignore-revs'
      - '.lycheeignore'
      - '.github/workflows/docs-quality.yml'
      # 20-09: repo Markdown mounted at /repo/<route>/ (contracts/documentation/site-mounted-repo-docs.v1.json)
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'LANGUAGE_DESIGN_PRIORITIES.md'
      - '.github/copilot-instructions.md'
      - 'apps/editor/vox-vscode/README.md'
      - 'crates/**/README.md'
      - 'examples/PARSE_STATUS.md'
      - 'examples/STYLE.md'
      - 'examples/compile-suite/README.md'
      - 'scripts/README.md'
      - 'scripts/coverage-graph/README.md'
      - 'scripts/show/README.md'
      - 'tree-sitter-vox/GRAMMAR_SSOT.md'
      - 'tree-sitter-vox/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: page "Last updated" dates come from git log (git-dates.mjs).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install system deps (dbus, required by wry/keyring on Linux)
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build docs tooling
        run: cargo build -p vox-cli -p vox-doc-pipeline

      # Hard gate: invalid frontmatter (bad category/status/missing training_eligible)
      # blocks the PR.  Previously only in CI; now also in pre-push (see pre_push.rs).
      - name: Doc lint (frontmatter, code fences, training rationale)
        run: cargo run -p vox-doc-pipeline -- --lint-only

      # Hard gate: ```vox blocks in docs must compile via vox-compiler.
      - name: Doctest extraction and check (SSG-agnostic)
        run: cargo run -p vox-cli ci doctest-md --strict

      - name: Internal Markdown link check
        run: cargo run -p vox-cli ci check-links

      - name: Canonical documentation map verify
        run: cargo run -p vox-cli ci canonical-map-verify

      - name: Install docs-astro deps
        working-directory: docs-astro
        run: pnpm install --frozen-lockfile

      - name: Build Starlight
        id: starlight_build
        working-directory: docs-astro
        run: pnpm build

      # Prove the offline link check can fail before trusting a green run: the
      # fixture holds one dead route and one dead anchor. Exit 2 = link failures;
      # 1 = runtime/input error, which does not count as detecting them.
      - name: Link checker self-test (fixture must fail)
        id: lychee_selftest
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: false
          jobSummary: false
          output: lychee/selftest.md
          args: --offline --no-progress --root-dir ${{ github.workspace }}/docs-astro/dist --include-fragments --index-files index.html docs-astro/tests/fixtures/broken-link/index.html

      - name: Assert link checker detects broken links
        shell: bash
        env:
          SELFTEST_EXIT: ${{ steps.lychee_selftest.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "${SELFTEST_EXIT}" != "2" ] \
            || ! grep -qF 'this-route-does-not-exist' lychee/selftest.md \
            || ! grep -qF 'no-such-anchor-p20' lychee/selftest.md; then
            echo "::error::link checker cannot detect broken links (lychee exit ${SELFTEST_EXIT}; expected 2 with both fixture URLs reported)"
            cat lychee/selftest.md || true
            exit 1
          fi

      - name: Docs unit tests
        working-directory: docs-astro
        run: node --test "tests/unit/*.test.mjs"

      # Pure-fs Playwright specs over dist/; no browser install needed.
      - name: Build-output checks
        working-directory: docs-astro
        run: npx playwright test tests/build-output/ --reporter=line

      # Hard gate: graduated from continue-on-error after baseline stabilised.
      # Covers docs-astro, apps/vox-mental-tracker, apps/experimental/visualizer, vox-codegen TS tests.
      - name: TypeScript lint (biome)
        run: npx @biomejs/biome@1.9.4 lint --reporter=github

      # Hard gate: was continue-on-error.  Markdownlint rules are explicitly
      # configured in .markdownlint.jsonc; no surprise failures from rule changes.
      - name: Markdown lint
        run: pnpm dlx markdownlint-cli2 "docs/src/contributors/**/*.md"

  generator-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Install system deps (dbus, required by wry/keyring on Linux)
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build CLI
        run: cargo build -p vox-cli

      # Hard gate: was continue-on-error.  Pre-commit hook regenerates + stages
      # these; CI verifies the result.  Silent drift is worse than a failed PR.
      - name: Check ignore-file sync
        run: cargo run -p vox-cli --quiet ci sync-ignore-files --verify

      # Hard gate: was continue-on-error. Plugin catalog drift runs in ci.yml ssot-drift.
      - name: Check CLI command surface
        run: cargo run -p vox-cli --quiet ci command-sync
