name: Docs Quality

on:
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'contracts/**'
      - 'crates/vox-doc-pipeline/**'
      - 'crates/vox-cli/**'
      - 'crates/vox-compiler/**'
      - 'crates/vox-runtime/**'
      # 84: tests/unit/mermaid-oracle.test.mjs reads these fixtures
      - 'crates/vox-diagram/tests/fixtures/**'
      - 'scripts/docs/**'
      - 'docs-astro/**'
      - '.git-blame-ignore-revs'
      - '.lycheeignore'
      - '.github/workflows/docs-quality.yml'
      # 20-09: mounted repo sources
      - '.github/copilot-instructions.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'LANGUAGE_DESIGN_PRIORITIES.md'
      - 'crates/**/README.md'
      - 'examples/**'
      - 'scripts/**/README.md'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'contracts/**'
      - 'crates/vox-doc-pipeline/**'
      - 'crates/vox-cli/**'
      - 'crates/vox-compiler/**'
      - 'crates/vox-runtime/**'
      # 84: tests/unit/mermaid-oracle.test.mjs reads these fixtures
      - 'crates/vox-diagram/tests/fixtures/**'
      - 'scripts/docs/**'
      - 'docs-astro/**'
      - '.git-blame-ignore-revs'
      - '.lycheeignore'
      - '.github/workflows/docs-quality.yml'
      # 20-09: mounted repo sources
      - '.github/copilot-instructions.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'LANGUAGE_DESIGN_PRIORITIES.md'
      - 'crates/**/README.md'
      - 'examples/**'
      - 'scripts/**/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install system deps (dbus, required by wry/keyring on Linux)
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build docs tooling
        run: cargo build -p vox-cli -p vox-doc-pipeline

      # Hard gate: invalid frontmatter (bad category/status/missing training_eligible)
      # blocks the PR.  Previously only in CI; now also in pre-push (see pre_push.rs).
      - name: Doc lint (frontmatter, code fences, training rationale)
        run: cargo run -p vox-doc-pipeline -- --lint-only

      # Hard gate: ```vox blocks in docs must compile via vox-compiler.
      - name: Doctest extraction and check (SSG-agnostic)
        run: cargo run -p vox-cli ci doctest-md --strict

      # Hard gate: tutorials are executable docs-as-tests (TUT-02).
      - name: Tutorial test harness
        run: cargo run -p vox-cli -- run --mode interp scripts/docs/tutorial-test-runner.vox -- --all

      # Hard gate: deterministic drift gate blocks merges that introduce new broken mentions
      # on reader-facing status: current pages. Existing drift is grandfathered in baseline.
      - name: Documentation Drift Gate
        run: cargo run -p vox-cli -- audit docs --check-drift

      # Informative & Definition-of-Done: analyze PR impact on reader-facing docs and check contract DoD
      - name: Docs PR Impact and Definition-of-Done
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p target
          cargo run -p vox-cli -- audit docs pr-impact \
            --diff-base ${{ github.event.pull_request.base.sha }} \
            --diff-head ${{ github.event.pull_request.head.sha }} \
            --diff-out target/pr-impact.md || true
          cargo run -p vox-cli -- audit docs dod \
            --diff-base ${{ github.event.pull_request.base.sha }} \
            --diff-head ${{ github.event.pull_request.head.sha }} || true
          if [ -f target/pr-impact.md ] && [ -n "${{ github.event.pull_request.number }}" ]; then
            COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
              --jq '.[] | select(.body | contains("<!-- vox-docs-freshness-pr-impact -->")) | .id' 2>/dev/null | head -n 1 || true)
            if [ -n "$COMMENT_ID" ]; then
              gh api --method PATCH repos/${{ github.repository }}/issues/comments/$COMMENT_ID -f body=@target/pr-impact.md 2>/dev/null || true
            else
              gh pr comment ${{ github.event.pull_request.number }} -F target/pr-impact.md 2>/dev/null || true
            fi
          fi

      # Hard gate: repo and contract link validation.
      - name: Internal Markdown link check
        run: cargo run -p vox-cli ci check-links

      - name: Canonical documentation map verify
        run: cargo run -p vox-cli ci canonical-map-verify

      - name: Install docs-astro deps
        working-directory: docs-astro
        run: pnpm install --frozen-lockfile

      - name: Build Starlight
        id: starlight_build
        working-directory: docs-astro
        run: pnpm build

      - name: Link checker self-test
        id: lychee_selftest
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: false
          output: lychee/selftest.md
          args: --offline --no-progress --root-dir ${{ github.workspace }}/docs-astro/dist --include-fragments --index-files index.html docs-astro/tests/fixtures/broken-link/index.html

      - name: Verify link checker self-test
        env:
          SELFTEST_EXIT: ${{ steps.lychee_selftest.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "$SELFTEST_EXIT" != "2" ]; then
            echo "::error::link checker cannot detect broken links (exit code $SELFTEST_EXIT != 2)"
            exit 1
          fi
          if ! grep -qF "this-route-does-not-exist" lychee/selftest.md || ! grep -qF "no-such-anchor-p20" lychee/selftest.md; then
            echo "::error::link checker cannot detect broken links (missing expected failure targets in report)"
            exit 1
          fi

      - name: Offline link check
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: --offline --no-progress --root-dir ${{ github.workspace }}/docs-astro/dist --include-fragments --index-files index.html 'docs-astro/dist/**/*.html'

      - name: Docs unit tests
        working-directory: docs-astro
        run: node --test "tests/unit/*.test.mjs"

      - name: Build-output checks
        working-directory: docs-astro
        run: npx playwright test tests/build-output/ --reporter=line

      - name: Reader layout visual-stepper checks
        working-directory: docs-astro
        run: npx playwright test tests/reader-layout.spec.ts --reporter=line

      - name: Upload reader layout review bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-layout-review-bundle
          path: docs-astro/test-results/review-bundle/

      # Hard gate: graduated from continue-on-error after baseline stabilised.
      # Covers docs-astro, apps/vox-mental-tracker, apps/experimental/visualizer, vox-codegen TS tests.
      - name: TypeScript lint (biome)
        run: npx @biomejs/biome@1.9.4 lint --reporter=github

      # Hard gate: was continue-on-error.  Markdownlint rules are explicitly
      # configured in .markdownlint.jsonc; no surprise failures from rule changes.
      - name: Markdown lint
        run: pnpm dlx markdownlint-cli2 "docs/src/contributors/**/*.md"

  generator-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Install system deps (dbus, required by wry/keyring on Linux)
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build CLI
        run: cargo build -p vox-cli

      # Hard gate: was continue-on-error.  Pre-commit hook regenerates + stages
      # these; CI verifies the result.  Silent drift is worse than a failed PR.
      - name: Check ignore-file sync
        run: cargo run -p vox-cli --quiet ci sync-ignore-files --verify

      # Hard gate: was continue-on-error. Plugin catalog drift runs in ci.yml ssot-drift.
      - name: Check CLI command surface
        run: cargo run -p vox-cli --quiet ci command-sync
