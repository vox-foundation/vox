name: Mobile E2E (iOS)

on:
  # push:main dropped (runner-remediation Task 9) — iOS E2E runs nightly only,
  # same as the Android lane (heavy macOS job, timeout exceeds the fast-lane cap).
  schedule:
    - cron: '0 3 * * *' # Run nightly
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          # The repo root has no pnpm-lock.yaml; this workflow only installs
          # the mobile app's workspace, so point the cache key at its lockfile.
          cache-dependency-path: apps/vox-mental-tracker/pnpm-lock.yaml

      - name: Install dependencies
        run: cd apps/vox-mental-tracker && pnpm install --frozen-lockfile

      - name: Build vox CLI
        run: cargo build -p vox-cli

      # No separate `pnpm build`: its build:vox step was a second, silent release
      # compile of vox-cli (14-30 min) whose dist/ the codegen below never used.
      # `vox compile --target mobile-*` runs `cargo tauri build`, so it needs tauri-cli.
      - name: Install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Tauri mobile codegen (iOS)
        run: |
          cd apps/vox-mental-tracker
          ../../target/debug/vox compile --target mobile-ios -o dist src/main.vox

      # Codegen writes next to the app's Vox.toml, not under the repo root.
      - name: Verify generated Tauri workspace
        run: test -f apps/vox-mental-tracker/target/generated/src-tauri/tauri.conf.json
