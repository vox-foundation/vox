name: Harness Eval (Nightly Live)

on:
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC nightly
  workflow_dispatch: {}

concurrency:
  group: harness-eval-nightly
  cancel-in-progress: false  # a scheduled run already in flight has already spent real money —
                              # a manual workflow_dispatch trigger should queue behind it, not
                              # cancel it and waste that spend. This is also what actually
                              # prevents the JSONL-append race and double-spend-past-the-cost-
                              # ceiling scenario a same-runner overlap would otherwise create —
                              # no separate file-level lock is needed for that failure mode.

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The token pushes only a bot branch; results reach main through a PR in the merge
      # queue (see the last step). The PAT (SSOT_AUTOREGEN_TOKEN) is preferred so that PR
      # triggers the required check; GITHUB_TOKEN works as a degraded fallback.
      contents: write        # push the bot results branch
      pull-requests: write   # open and enqueue the results PR
    steps:
      # Pinned to the same immutable SHA ci.yml's ssot-autoregen job uses for actions/checkout,
      # for the same reason: this job has contents: write. persist-credentials:false avoids
      # leaving the clone token in .git/config; the push step below authenticates explicitly.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Without the key, model routing falls back to a local endpoint that does not exist
      # on the runner and all 12 tasks fail opaquely; say what is actually missing.
      - name: Require the OpenRouter key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::OPENROUTER_API_KEY repository secret is not set; the live eval cannot call any model."
            exit 1
          fi

      # Pinned toolchain + a main-only cargo cache: the uncached release build took 22-29
      # of this job's 30 minutes. The suffix keeps the release target off the dev-profile keys.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: -harness-release

      - name: Build vox-cli
        run: cargo build --release -p vox-cli

      - name: Run live harness eval
        env:
          VOX_HARNESS_EVAL_TRIGGERED_BY: ci-nightly
          # Confirm the real secret name(s) in Step 1 — this assumes an OPENROUTER_API_KEY
          # secret already exists for other live-calling automation; verify before relying on it.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: ./target/release/vox harness eval --live --samples 3

      - name: Publish results to git-tracked history
        run: ./target/release/vox harness publish

      # Keep the already-paid-for results even if the PR path below fails.
      - name: Upload published results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-eval-results-${{ github.run_id }}
          path: docs/harness-eval-history/runs/
          if-no-files-found: ignore
          retention-days: 90

      # main is reachable only through the merge queue (main-merge-queue ruleset +
      # enforce_admins), so results land as a PR instead of a direct push. One file per
      # run (docs/harness-eval-history/runs/<run_id>.jsonl): concurrent results PRs never
      # conflict, which a shared append-only file did (GitHub's merge ignores merge=union).
      - name: Open a results PR and enqueue it
        env:
          # A PR opened with GITHUB_TOKEN does not trigger other workflows, so the required
          # check would never run on it; the PAT does. Passed via env, never inline.
          GH_TOKEN: ${{ secrets.SSOT_AUTOREGEN_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.SSOT_AUTOREGEN_TOKEN != '' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          trap 'echo "::error::results PR not opened; the results are in artifact harness-eval-results-${RUN_ID}"' ERR
          if [ -z "$(git status --porcelain -- docs/harness-eval-history/runs)" ]; then
            echo "nothing new published; nothing to commit."
            exit 0
          fi
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::SSOT_AUTOREGEN_TOKEN is not set: the results PR is opened with GITHUB_TOKEN, which does not trigger the required CI check; push to it (or close and reopen it) to run CI."
          fi
          branch="bot/harness-eval-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/harness-eval-history/runs
          git commit -m "chore(harness-eval): publish nightly run results"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          url=$(gh pr create --base main --head "$branch" \
            --title "chore(harness-eval): nightly results (run ${RUN_ID})" \
            --body "Automated: results of harness-eval-nightly run ${RUN_ID}, one file per run under docs/harness-eval-history/runs/.")
          # With the merge queue, --auto enqueues once the required checks pass.
          gh pr merge "$url" --auto --squash
