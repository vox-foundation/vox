name: GUI Cross-Platform Build (Win/macOS/Ubuntu)

on:
  # Not on pull_request/merge_group: the full Win/macOS/Ubuntu matrix
  # (gui-cross-build 90m) exceeds the fast-lane (PR/merge_group) 30-min cap
  # (workflow_policy_guard). Runs nightly instead, mirroring mobile-e2e-ios's
  # move off push/PR (per-PR compile signal for vox-gui is still covered by
  # ci.yml's own Linux build).
  schedule:
    - cron: '0 5 * * *'   # Nightly, staggered from other 03:00-06:00 UTC lanes
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # Emit the build matrix: full Win/macOS/Ubuntu on every (nightly/dispatch) run.
  matrix-setup:
    name: Compute GUI matrix
    # Pure-bash compute job — runs on the local fleet per local-first policy.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - id: gen
        shell: bash
        run: |
          set -euo pipefail
          linux='{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"}'
          win='{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}'
          mac='{"os":"macos-latest","target":"aarch64-apple-darwin"}'
          echo "include=[$linux,$win,$mac]" >> "$GITHUB_OUTPUT"

  gui-cross-build:
    name: GUI Build (${{ matrix.os }})
    needs: matrix-setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix-setup.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      # Same policy as cross-platform-check.yml: the GHA backend writes one
      # unbounded Actions-cache entry per object, so only main (schedule) writes
      # it; bump SCCACHE_GHA_VERSION to orphan the old object set.
      # SCCACHE_CACHE_SIZE bounds the local disk cache (cache-key-lint).
      SCCACHE_GHA_ENABLED: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
      SCCACHE_GHA_VERSION: v2
      SCCACHE_CACHE_SIZE: 5G
      CARGO_INCREMENTAL: "0"
      VOX_GUI_SKIP_SIDECAR_AUTOBUILD: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install WebKitGTK + ALSA (Ubuntu)
        if: runner.os == 'Linux'
        # libasound2-dev: vox-gui's cpal mic-capture (desktop speech-to-text) pulls
        # alsa-sys, whose build script needs the ALSA dev headers.
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libasound2-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/vox-gui/ui/pnpm-lock.yaml

      - name: GUI frontend build (pnpm)
        run: |
          cd crates/vox-gui/ui
          pnpm install --prefer-offline
          pnpm run build

      # Asset-level guards for the Tauri shell. Lives here rather than in a
      # workspace-check lane because compiling any vox-gui target runs tauri-build,
      # which embeds `ui/dist` — gitignored, so it only exists after the pnpm step
      # above. `png_icons_are_8_bit` catches 16-bit PNGs, which tao rejects inside
      # the macOS did_finish_launching delegate as a non-unwinding panic: the app
      # aborts before a window appears, and Windows never sees it because it loads
      # icon.ico instead.
      # This lane compiles and tests vox-gui; it never runs a sidecar. build.rs only
      # checks the two externalBin files (vox, vox-ml-cli) exist, and with them missing
      # it silently built both in release from inside the first vox-gui compile, while
      # this job then built vox-cli in release again: three full builds per leg, past
      # the 90-min cap on every leg since 2026-10-05. Placeholders + autobuild off.
      - name: Stage Tauri external sidecar placeholders
        shell: bash
        run: |
          set -euo pipefail
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          mkdir -p target/release
          for bin in vox vox-ml-cli; do
            touch "target/release/${bin}-${{ matrix.target }}${ext}"
          done

      - name: Tauri prerequisites (icon bit depth, sidecar paths)
        run: cargo test -p vox-gui --test gui_tauri_prereqs

      # The `gui-*` aliases link vox-gui with link.exe on Windows: lld-link cannot
      # reconcile ucrt.lib and libucrt.lib for it (.cargo/config.toml). They only
      # set a Windows-target linker, so macOS/Linux legs build the same as before.
      - name: vox-gui tests
        run: cargo gui-test --locked

      - name: Build vox-gui (Tauri)
        run: cargo gui-build

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # Moved from nightly.yml (2026-10-06, hosted-ci plan Task 0.4): at 93-124 min
  # it set nightly's wall time; this workflow is already the scheduled GUI
  # build lane.
  #
  # Portable Windows lane: proves the Tauri shell compiles and the binary starts
  # (headless `--print-action-manifest-json`). Catches manifest/sidecar/icon drift
  # that Linux CI excludes when `vox-gui` is omitted from nextest/clippy.
  gui-windows-build-smoke:
    name: GUI Windows build smoke
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/vox-gui/ui/pnpm-lock.yaml

      # No separate Swatinem/rust-cache step: setup-rust above already caches
      # on OS + toolchain + Cargo.lock -- no separate cache step needed here.
      - name: GUI frontend build (pnpm)
        run: |
          cd crates/vox-gui/ui
          pnpm install --prefer-offline
          pnpm run build

      - name: Build vox CLI sidecar (release)
        run: cargo build -p vox-cli --release

      - name: Stage Tauri external sidecar
        shell: pwsh
        run: |
          Copy-Item target/release/vox.exe target/release/vox-x86_64-pc-windows-msvc.exe -Force

      - name: Tauri prerequisite tests
        run: cargo test -p vox-gui --test gui_tauri_prereqs

      # `cargo gui-build` links with link.exe: lld-link cannot reconcile ucrt.lib and
      # libucrt.lib for vox-gui (.cargo/config.toml, [target.x86_64-pc-windows-msvc]).
      - name: Build vox-gui (Tauri)
        run: cargo gui-build

      - name: Headless binary smoke (action manifest)
        shell: pwsh
        run: |
          $out = & target/debug/vox-gui.exe --print-action-manifest-json
          if (-not $out) { throw 'empty action manifest' }
          if ($out -notmatch '"actions"') { throw 'action manifest JSON missing actions key' }
