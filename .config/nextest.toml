[profile.default]
retries = 2
# Per-test hang detection (this cargo-nextest build does not accept profile-level `global-timeout`).
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false

[profile.ci]
retries = 1
# llvm-cov / self-hosted runners: full `generate()` on large fixtures can exceed 240s wall time.
slow-timeout = { period = "180s", terminate-after = 3 }

# ── Slow-test partition ──────────────────────────────────────────────────────
#
# Tests annotated `#[ignore = "slow; ..."]` are excluded from default
# `cargo nextest run` (and `vox ci pre-push --full`).
# Run them explicitly with:
#   - locally:  vox ci pre-push --full --include-slow
#   - CI:       separate "slow tests" step (see .github/workflows/ci.yml)
#   - one-off:  cargo nextest run --run-ignored ignored-only
#
# Tests in this partition (as of 2026-06-10):
#   arch_check_live_workspace_smoke_and_description_rule (~125s, vox-arch-check)
#   timeout_kills_long_running_child               (~29s,  vox-scientia)
#   generated_ai_fixture_bundle_passes_cargo_check (~25s,  vox-codegen)
#
[test-groups.slow]
max-threads = 1

# Tests that run a nested `cargo build` (each compiles a generated crate; 43-401 s apiece on
# a hosted runner, 2026-10-03). They queue on cargo's build-dir lock anyway, so run them one
# at a time, and only in the nightly `ci` profile; `ci-gate` (the PR gate) excludes the same
# filter below. Keep the two copies of the filter identical.
[test-groups.nested-cargo]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary_id(=vox-codegen::emit_compile_harness) | (binary_id(=vox-compiler::emission_ladder_test) & test(/_compiles_as_rust_script$/)) | binary_id(=vox-cli-tests::build_e2e) | binary_id(=vox-config-derive::trybuild) | binary_id(=vox-cli-tests::workflow_runtime_no_db)'
test-group = 'nested-cargo'

# The required PR gate (ci.yml `tests` shards) runs this profile: `ci` plus a
# quarantine of tests that fail on `main` for reasons unrelated to the PR under
# test. Tracked in https://github.com/vox-foundation/vox/issues/569 -- fix the
# test, then delete its line here. nightly.yml keeps running them under `ci`.
# Do not add to this list to make a PR green: a new failure is the PR's to fix.
[profile.ci-gate]
retries = 1
slow-timeout = { period = "180s", terminate-after = 3 }
default-filter = '''not (
    (binary_id(=vox-codegen::emit_compile_harness) | (binary_id(=vox-compiler::emission_ladder_test) & test(/_compiles_as_rust_script$/)) | binary_id(=vox-cli-tests::build_e2e) | binary_id(=vox-config-derive::trybuild) | binary_id(=vox-cli-tests::workflow_runtime_no_db))
  | (binary_id(=vox-cli::it) & test(=db_migrate_semantics_test::migrate_dry_run_defaults_to_local_codex_without_app_plane_env))
  | (binary_id(=vox-cli::it) & test(=secrets_backend_status_test::backend_status_prints_vault_health_lines))
  | (binary_id(=vox-integration-tests::codegen_rust_test) & test(=codegen_with_all_options))
  | (binary_id(=vox-integration-tests::golden_behavioral_gate) & test(=golden_expect_blocks_match_interp_stdout))
  | (binary_id(=vox-integration-tests::golden_vox_test_runner) & test(=all_golden_at_test_fns_pass))
  | (binary_id(=vox-integration-tests::greaterfool_parity_gates_test) & test(=greaterfool_reference_emits_secure_runtime_defaults))
  | (binary_id(=vox-integration-tests::pipeline_test) & test(=pipeline_multi_route_rust_codegen))
  | (binary_id(=vox-integration-tests::ts_emit_corpus_sync_test) & test(=promoted_fixtures_match_their_golden_source))
  | (binary_id(=vox-orchestrator-mcp) & test(=chat_tools::chat::agent_loop::tests::chat_message_default_path_sends_tools_bearing_request))
)'''
