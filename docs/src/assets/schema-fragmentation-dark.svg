<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-labelledby="t d">
  <title id="t">One declaration versus four copies</title>
  <desc id="d">On the left, the same field written four times: SQL completed_at TIMESTAMP NULL, Rust completed_at Option of DateTime, JSON completedAt null, and React task.isDone boolean. On the right, one Vox table Task with title str and done bool, with arrows to a SQL table, a Rust server, a TypeScript client and an agent tool description.</desc>
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e0556a"/></marker>
    <marker id="arrGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d4af37"/></marker>
  </defs>
  <style>
    .serif { font-family: Palatino, "Palatino Linotype", "Book Antiqua", "EB Garamond", Georgia, serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #e8e4da; }
    .red { fill: #e0556a; }
    .green { fill: #5fcf8a; }
  </style>
  <rect width="1376" height="768" fill="#12151c"/>
  <rect x="8" y="8" width="1360" height="752" fill="none" stroke="#d4af37" stroke-width="10"/>
  <rect x="26" y="26" width="1324" height="716" fill="none" stroke="#d4af37" stroke-width="2"/>

  <text x="688" y="104" text-anchor="middle" class="serif ink" font-size="46" letter-spacing="1">ONE DECLARATION VS. FOUR COPIES</text>
  <text x="340" y="172" text-anchor="middle" class="serif red" font-size="32">TODAY: FOUR COPIES THAT DRIFT</text>
  <text x="1030" y="172" text-anchor="middle" class="serif green" font-size="32">VOX: WRITE IT ONCE</text>
  <line x1="688" y1="130" x2="688" y2="720" stroke="#4a5468" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Left: four copies -->
  <g stroke="#4a5468" stroke-width="2" fill="#1d222d">
    <rect x="115" y="195" width="485" height="100" rx="6"/>
    <rect x="115" y="325" width="485" height="100" rx="6"/>
    <rect x="115" y="455" width="485" height="100" rx="6"/>
    <rect x="115" y="585" width="485" height="100" rx="6"/>
  </g>
  <g class="ink" font-size="28">
    <text x="140" y="238" class="serif">SQL:</text>
    <text x="140" y="276" class="mono" font-size="23">completed_at TIMESTAMP NULL</text>
    <text x="140" y="368" class="serif">Rust:</text>
    <text x="140" y="406" class="mono" font-size="23">completed_at: Option&lt;DateTime&gt;</text>
    <text x="140" y="498" class="serif">JSON:</text>
    <text x="140" y="536" class="mono" font-size="23">"completedAt": null</text>
    <text x="140" y="628" class="serif">React:</text>
    <text x="140" y="666" class="mono" font-size="23">task.isDone: boolean</text>
  </g>
  <g fill="none" stroke="#e0556a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M360 300 L347 310 L365 310 L352 320" marker-end="url(#arrRed)"/>
    <path d="M360 430 L347 440 L365 440 L352 450" marker-end="url(#arrRed)"/>
    <path d="M360 560 L347 570 L365 570 L352 580" marker-end="url(#arrRed)"/>
  </g>

  <!-- Right: one declaration -->
  <rect x="735" y="262" width="250" height="360" fill="#1d222d" stroke="#d4af37" stroke-width="10"/>
  <rect x="747" y="274" width="226" height="336" fill="none" stroke="#d4af37" stroke-width="2"/>
  <g class="mono ink" font-size="28">
    <text x="765" y="410">table Task {</text>
    <text x="789" y="450">title: str</text>
    <text x="789" y="490">done: bool</text>
    <text x="765" y="530">}</text>
  </g>
  <g stroke="#4a5468" stroke-width="2" fill="#1d222d">
    <rect x="1115" y="195" width="215" height="100" rx="6"/>
    <rect x="1115" y="325" width="215" height="100" rx="6"/>
    <rect x="1115" y="455" width="215" height="100" rx="6"/>
    <rect x="1115" y="585" width="215" height="100" rx="6"/>
  </g>
  <g class="serif ink" font-size="30" text-anchor="middle">
    <text x="1222" y="240">SQL</text><text x="1222" y="278">table</text>
    <text x="1222" y="370">Rust</text><text x="1222" y="408">server</text>
    <text x="1222" y="500">TypeScript</text><text x="1222" y="538">client</text>
    <text x="1222" y="630">Agent tool</text><text x="1222" y="668">description</text>
  </g>
  <g fill="none" stroke="#d4af37" stroke-width="6" stroke-linecap="round">
    <path d="M992 360 C1040 330 1070 260 1108 248" marker-end="url(#arrGold)"/>
    <path d="M992 400 C1040 395 1070 385 1108 378" marker-end="url(#arrGold)"/>
    <path d="M992 440 C1040 450 1070 480 1108 508" marker-end="url(#arrGold)"/>
    <path d="M992 480 C1040 520 1070 600 1108 638" marker-end="url(#arrGold)"/>
  </g>
</svg>
