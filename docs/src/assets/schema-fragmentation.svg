<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 512" width="760" height="491" role="img" aria-labelledby="fragTitle fragDesc">
  <title id="fragTitle">One field, written four times</title>
  <desc id="fragDesc">A task completion field is completed_at in SQL, Option of DateTime in Rust, completedAt null in JSON, and isDone boolean in TypeScript. One Vox table states done as bool, and SQL, Rust, JSON, and TypeScript all keep that name.</desc>
  <style>
    svg { color-scheme: light dark; }
    .canvas { fill: #f1f5f9; stroke: #cbd5e1; }
    .ink { fill: #0f172a; }
    .muted { fill: #475569; }
    .dim { fill: #334155; }
    .hot { fill: #c2410c; }
    .panel { fill: #ffffff; stroke: #cbd5e1; }
    .well { fill: #f8fafc; stroke: #cbd5e1; }
    .chip { fill: #fff7ed; stroke: #fdba74; }
    .chiptext { fill: #9a3412; }
    .good { fill: #f0fdfa; stroke: #5eead4; }
    .goodink { fill: #0f766e; }
    .stem { stroke: #94a3b8; }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0d131f; stroke: #1e293b; }
      .ink { fill: #f8fafc; }
      .muted { fill: #94a3b8; }
      .dim { fill: #cbd5e1; }
      .hot { fill: #fdba74; }
      .panel { fill: #121826; stroke: #243044; }
      .well { fill: #0b0f17; stroke: #243044; }
      .chip { fill: #3b2410; stroke: #92400e; }
      .chiptext { fill: #fdba74; }
      .good { fill: #062e2a; stroke: #115e59; }
      .goodink { fill: #5eead4; }
      .stem { stroke: #334155; }
    }
  </style>

  <rect class="canvas" x="1" y="1" width="790" height="510" rx="18"/>
  <g transform="translate(16, 12)">
  <text class="ink" x="4" y="24" font-size="20" font-weight="700">One field, written four times</text>
  <text class="muted" x="4" y="46" font-size="13">The same fact changes name or type at every boundary.</text>

  <rect class="panel" x="0" y="64" width="372" height="420" rx="14"/>
  <text class="hot" x="18" y="90" font-size="12" font-weight="700">FOUR COPIES</text>

  <rect class="well" x="16" y="104" width="340" height="52" rx="8"/>
  <text class="muted" x="30" y="123" font-size="11" font-weight="650">1 / Database / SQL</text>
  <text class="mono" x="30" y="144" font-size="15">
    <tspan class="hot">completed_at</tspan><tspan class="dim">  timestamptz</tspan>
  </text>

  <rect class="well" x="16" y="188" width="340" height="52" rx="8"/>
  <text class="muted" x="30" y="207" font-size="11" font-weight="650">2 / Backend / Rust</text>
  <text class="mono" x="30" y="228" font-size="15">
    <tspan class="hot">completed_at</tspan><tspan class="dim">: Option&lt;DateTime&gt;</tspan>
  </text>

  <rect class="well" x="16" y="272" width="340" height="52" rx="8"/>
  <text class="muted" x="30" y="291" font-size="11" font-weight="650">3 / Wire / JSON</text>
  <text class="mono" x="30" y="312" font-size="15">
    <tspan class="hot">"completedAt"</tspan><tspan class="dim">: null</tspan>
  </text>

  <rect class="well" x="16" y="356" width="340" height="52" rx="8"/>
  <text class="muted" x="30" y="375" font-size="11" font-weight="650">4 / Frontend / TypeScript</text>
  <text class="mono" x="30" y="396" font-size="15">
    <tspan class="hot">isDone?</tspan><tspan class="dim">: boolean</tspan>
  </text>

  <line class="stem" x1="186" y1="156" x2="186" y2="188" stroke-width="1.5"/>
  <line class="stem" x1="186" y1="240" x2="186" y2="272" stroke-width="1.5"/>
  <line class="stem" x1="186" y1="324" x2="186" y2="356" stroke-width="1.5"/>

  <rect class="chip" x="112" y="162" width="148" height="20" rx="10"/>
  <text class="chiptext" x="186" y="176" font-size="11" font-weight="650" text-anchor="middle">type changes</text>
  <rect class="chip" x="128" y="246" width="116" height="20" rx="10"/>
  <text class="chiptext" x="186" y="260" font-size="11" font-weight="650" text-anchor="middle">renamed</text>
  <rect class="chip" x="108" y="330" width="156" height="20" rx="10"/>
  <text class="chiptext" x="186" y="344" font-size="11" font-weight="650" text-anchor="middle">renamed again</text>

  <text class="muted" x="18" y="448" font-size="12">Four definitions to keep aligned.</text>

  <rect class="good" x="388" y="64" width="372" height="420" rx="14"/>
  <text class="goodink" x="406" y="90" font-size="12" font-weight="700">ONE TABLE</text>

  <rect class="well" x="404" y="104" width="340" height="108" rx="8"/>
  <text class="mono dim" x="420" y="128" font-size="15">table Task {</text>
  <text class="mono" x="420" y="152" font-size="15">
    <tspan class="dim">    title: </tspan><tspan class="goodink">str</tspan>
  </text>
  <text class="mono" x="420" y="176" font-size="15">
    <tspan class="dim">    done:  </tspan><tspan class="goodink">bool</tspan>
  </text>
  <text class="mono dim" x="420" y="198" font-size="15">}</text>

  <text class="goodink" x="406" y="238" font-size="12" font-weight="650">Emitted, not rewritten</text>

  <rect class="well" x="404" y="252" width="340" height="34" rx="8"/>
  <text class="muted" x="418" y="274" font-size="12">SQL</text>
  <text class="mono" x="530" y="274" font-size="14"><tspan class="goodink">done</tspan><tspan class="dim">  boolean</tspan></text>

  <rect class="well" x="404" y="294" width="340" height="34" rx="8"/>
  <text class="muted" x="418" y="316" font-size="12">Rust</text>
  <text class="mono" x="530" y="316" font-size="14"><tspan class="goodink">done</tspan><tspan class="dim">: bool</tspan></text>

  <rect class="well" x="404" y="336" width="340" height="34" rx="8"/>
  <text class="muted" x="418" y="358" font-size="12">JSON</text>
  <text class="mono" x="530" y="358" font-size="14"><tspan class="goodink">"done"</tspan><tspan class="dim">: false</tspan></text>

  <rect class="well" x="404" y="378" width="340" height="34" rx="8"/>
  <text class="muted" x="418" y="400" font-size="12">TypeScript</text>
  <text class="mono" x="530" y="400" font-size="14"><tspan class="goodink">done</tspan><tspan class="dim">: boolean</tspan></text>

  <text class="muted" x="406" y="448" font-size="12">Same name. Same type.</text>
  </g>
</svg>
