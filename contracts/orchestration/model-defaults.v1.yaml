# Model defaults — the SINGLE source of every default / fallback model id (Task 14).
#
# Code never hard-codes a vendor model id: `crates/vox-config/build.rs` generates
# `vox_config::model_defaults::<ROLE>` consts (SCREAMING_SNAKE of `role`) from this
# file, and `crates/vox-config/tests/model_defaults_test.rs` fails on any vendor id
# literal outside it (catalogs that *list* models are exempt).
#
# These are FALLBACKS: registry selection, operator pins (VOX_MODEL_FORCE*) and
# user config still win. Each entry: `role`, `model` (or `models` for an ordered
# list), `rationale`, `verified_on` (date the id was seen in the live OpenRouter
# catalog, or why it was not).
#
# Roles prefixed `premium_` feed `premium_alias` (model-routing / model-pins
# loaders); `classifier_*` feed `model-pins` `classifier`.
schema_version: 1
defaults:
  - role: chat
    model: "~google/gemini-flash-latest"
    rationale: "Default chat model (VoxConfig.model). Plan Task 14 seed: the only candidate taking audio/video/file input."
    verified_on: "2026-10-30 (live OpenRouter ~alias list)"
  - role: research
    model: "~deepseek/deepseek-flash-latest"
    rationale: "Research planner/claim/synthesis fallback and Lane G fallback. Plan Task 14 seed: ~8x cheaper than the Gemini pin per deep run."
    verified_on: "2026-10-30 (live OpenRouter ~alias list)"
  - role: judge
    model: "~deepseek/deepseek-pro-latest"
    rationale: "Research judge / review premium fallback. Plan Task 14 seed."
    verified_on: "2026-10-30 (live OpenRouter ~alias list)"
  - role: claim_extraction
    model: "~google/gemini-flash-latest"
    rationale: "NLI / claim verifier fallback (was NLI_FALLBACK): live Gemini Flash alias (OpenRouter has no flash-lite alias); structured output."
    verified_on: "2026-10-30 (live OpenRouter ~alias list)"
  - role: code_repair
    model: "~anthropic/claude-sonnet-latest"
    rationale: "`vox repair` loop (was REPAIR_LOOP_PREFERRED): price/quality optimum with prompt caching."
    verified_on: "2026-10-30 (live OpenRouter ~alias list)"
  - role: code_review
    model: "~anthropic/claude-sonnet-latest"
    rationale: "vox-code-audit review via OpenRouter."
    verified_on: "2026-10-30 (live OpenRouter ~alias list)"
  - role: openai_direct
    model: "gpt-5-mini"
    rationale: "OpenAI API directly (OpenAI-native id) when OPENAI_MODEL is unset: vox-code-audit's OpenAI default and the OPENAI_MODEL registry default. Stays versioned: the OpenAI API has no unversioned mini alias (OpenRouter routes use ~openai/gpt-mini-latest)."
    verified_on: "2026-09-27 (as openai/gpt-5-mini)"
  - role: gemini_openrouter
    model: "~google/gemini-flash-latest"
    rationale: "Gemini route target via OpenRouter when OPENROUTER_GEMINI_MODEL is unset."
    verified_on: "2026-10-30 (live OpenRouter ~alias list)"
  - role: gemini_direct
    model: "gemini-flash-latest"
    rationale: "Gemini route target via the Google API directly when GEMINI_DIRECT_MODEL / GEMINI_MODEL is unset; Google-native unversioned alias. Also vox-code-audit's Gemini default."
    verified_on: "2026-10-30 (Google API unversioned alias)"
  - role: free_floor
    models:
      - "google/gemma-4-31b-it:free"
      - "qwen/qwen3-coder:free"
      - "openai/gpt-oss-120b:free"
      - "deepseek/deepseek-r1-0528:free"
      - "minimax/minimax-m2.5:free"
    rationale: "Research free-tier floor (was OPENROUTER_FREE_FALLBACK_MODELS): concrete dispatchable :free slugs verified in live OpenRouter catalog (platform-ssot v2.1)."
    verified_on: "2026-10-18"
  - role: premium_codegen
    model: "~anthropic/claude-sonnet-latest"
    rationale: "premium_alias codegen (platform-ssot v2.1 OpenRouter :latest alias)."
    verified_on: "2026-10-18"
  - role: premium_debugging
