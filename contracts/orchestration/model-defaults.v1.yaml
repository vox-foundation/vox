# Model defaults — the SINGLE source of every default / fallback model id (Task 14).
#
# Code never hard-codes a vendor model id: `crates/vox-config/build.rs` generates
# `vox_config::model_defaults::<ROLE>` consts (SCREAMING_SNAKE of `role`) from this
# file, and `crates/vox-config/tests/model_defaults_test.rs` fails on any vendor id
# literal outside it (catalogs that *list* models are exempt).
#
# These are FALLBACKS: registry selection, operator pins (VOX_MODEL_FORCE*) and
# user config still win. Each entry: `role`, `model` (or `models` for an ordered
# list), `rationale`, `verified_on` (date the id was seen in the live OpenRouter
# catalog, or why it was not).
#
# Roles prefixed `premium_` feed `premium_alias` (model-routing / model-pins
# loaders); `classifier_*` feed `model-pins` `classifier`.
schema_version: 1
defaults:
  - role: chat
    model: "google/gemini-3.8-flash"
    rationale: "Default chat model (VoxConfig.model). Plan Task 14 seed: the only candidate taking audio/video/file input."
    verified_on: "2026-09-27"
  - role: research
    model: "~deepseek/deepseek-flash-latest"
    rationale: "Research planner/claim/synthesis fallback and Lane G fallback. Plan Task 14 seed: ~8x cheaper than the Gemini pin per deep run."
    verified_on: "2026-09-27"
  - role: judge
    model: "~deepseek/deepseek-pro-latest"
    rationale: "Research judge / review premium fallback. Plan Task 14 seed."
    verified_on: "2026-09-27"
  - role: claim_extraction
    model: "google/gemini-3.1-flash-lite"
    rationale: "NLI / claim verifier fallback (was NLI_FALLBACK): cheapest classifier-grade model with structured output."
    verified_on: "2026-09-27"
  - role: code_repair
    model: "anthropic/claude-sonnet-4.6"
    rationale: "`vox repair` loop (was REPAIR_LOOP_PREFERRED): price/quality optimum with prompt caching."
