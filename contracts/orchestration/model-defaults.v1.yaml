    verified_on: "2026-10-18"
  - role: premium_security
    model: "~anthropic/claude-sonnet-latest"
    rationale: "premium_alias security (platform-ssot v2.1 OpenRouter :latest alias)."
    verified_on: "2026-10-18"
  - role: premium_research
