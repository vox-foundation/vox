# Vox Model Pins — Council-Reviewed SSOT
#
# Council-ratified 2026-09-15 (rotation_id: 2026-Q3-modern-frontiers).
# Companion to model-routing.v1.yaml + model-catalog.bootstrap.v1.json.
#
# Role:
#   - This file is the SSOT for *pinned* model decisions: premium aliases, version locks for
#     reproducibility-critical contexts (CR-L0 eval panel), and council rotation IDs.
#   - It is decoupled from `model-catalog.bootstrap.v1.json` (which is the *catalog fallback*
#     for cold-start / offline use, and may be auto-refreshed by L1 discovery).
#
# Lifecycle:
#   - Reviewed quarterly by the model council (rotation_id below).
#   - Changes require council signoff and a corresponding entry in
#     docs/src/architecture/modern-model-selection-and-cost-accuracy-ssot-2026.md.
#
# See docs/src/architecture/modern-model-selection-and-cost-accuracy-ssot-2026.md for design rationale.

# CR-A4 lifecycle metadata (added 2026-05-21 per honest-completion plan §5.8).
# v1 schemas are considered stable. Bump to a v2 file (with explicit
# migration_window) when introducing breaking changes.
lifecycle: stable

schema: vox.orchestration.pins/v1

# Premium-alias map (task-category → model id): moved to
# contracts/orchestration/model-defaults.v1.yaml as the `premium_<category>` roles
# (Task 14). `vox_config::load_model_pins_config()` fills `premium_alias` from there.
# When SelectionIntent.axes.intelligence >= 50, `select()` honors these pins
# over scorer output.
#
# Eval-panel version pins (formerly `version_pins:` here, read by no code) live
# only in contracts/eval/llm-panel.v1.yaml (members.*.version_pinned).

# CR-L8 corpus-feedback flywheel: the *classifier* used for L2 auto-classification.
# Its model ids (primary / fallback) are the `classifier_primary` / `classifier_fallback`
# roles in model-defaults.v1.yaml (Task 14); the loader fills them in.
classifier:
  # Promotion-threshold defaults (override per-deployment via env).
  promotion_thresholds:
    # Minimum successful calls before Provisional → Shadowed.
    min_successful_calls: 30
    # Maximum p50 latency relative to catalog median.
    max_p50_latency_multiple: 2.0
    # Minimum self-reported classifier confidence to accept its tags.
    min_classifier_confidence: 0.70

# Council signoff metadata. Lint job (vox audit pins) verifies this is current.
council_signoff:
  rotation_id: "2026-Q3-modern-frontiers"
  approved_by:
    - council
  approved_at: "2026-09-15"
  next_review_due: "2026-12-15"
  rationale_doc: "docs/src/architecture/modern-model-selection-and-cost-accuracy-ssot-2026.md"

# Retirement awareness — list of model ids that have been explicitly retired
# and should NOT be auto-classified or shadow-evaluated even if they reappear
# in an upstream catalog (e.g. via OpenRouter alias).
retired_ids:
  - "claude-mythos-preview-20260407"
  - "google/gemini-2.5-pro-preview"
  - "qwen/qwen-2.5-72b-instruct"
  - "qwen/qwen-2.5-coder-32b-instruct"
  - "mistralai/mixtral-8x7b-instruct-v0.1"
