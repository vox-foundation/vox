# Single interpretation of Arca / Codex schema_version vs repository BASELINE_VERSION.
# SSOT for runtime: crates/vox-db/src/schema/manifest.rs (BASELINE_VERSION) and VoxDb::migrate.
schema_version: 1

policy:
  # Integer stored in DB `schema_version` table after baseline migration succeeds.
  repository_baseline_integer: 96
  # Keccak-256 of baseline_sql() — updated for 83: skill_candidates.lifecycle_state + source_hash (Task 3.3, harness parity plan);
  # re-updated for a comment fix (source_hash is blake3-only, not Keccak/blake3 — code-review finding on cd3f7e8736);
  # re-updated for skill_identities table (Task 3.4, harness parity plan — skill namespace/identity FCFS uniqueness);
  # re-updated for a superseded-by-reliability_scores doc comment on the legacy skill_reliability table
  # (final holistic branch review finding: CLI report was still reading the dead table);
  # re-updated for 85: quarantine of 42 DDL-bearing DORMANT/DEAD tables out of the default
  # baseline (Task 4, VoxDB audit condensation plan) — digest is of the default (quarantine
  # feature OFF) baseline_sql().
  # re-updated (still 85, no BASELINE_VERSION bump needed): conversation_versions,
  # conversation_edges, topic_evolution_events restored to the default baseline after a
  # pre-migration sweep found Task 4 wrongly quarantined them (real caller in
  # vox-orchestrator-mcp via a delegation-alias layer the automated census missed).
  # re-updated for 86: harness_eval_run/task_result/model_selection_event tables
  # (harness_eval domain fragment) added alongside the Task 4 quarantine work.
  # re-updated for 87: conversations.archived_at (soft-archive for GUI chat sessions,
  # sidebar session-list feature). Existing databases get the column via an explicit
  # ALTER TABLE in VoxDb::migrate() (see open.rs), not via the baseline DDL alone.
  # re-updated for 88: scientia_harness_issues/decisions/fix_proposals tables
  # (harness issue discovery Phase 1, Task 1).
  # re-updated for 89: ON DELETE CASCADE foreign keys from
  # scientia_harness_decisions/scientia_harness_fix_proposals to
  # scientia_harness_issues (PR review finding).
  # re-updated for 90: partial unique index enforcing the chat_session pending
  # dedup rule at the database level (PR review finding).
  # re-updated for 91: web_cache table and indexes (Task 1.3, deep research local web cache).
  # re-updated for 92: covering indexes idx_knowledge_edges_src_rel and idx_knowledge_edges_dst_rel for recursive CTE (Task 4.1, cycle-safe relational epistemic graph CTE traversal).
  # re-updated for 93: research_misguidance_events (with status and resolved_at_ms) and research_domain_reputation tables in scientia domain (Task 1), and provider_quota_usage table in knowledge domain (Task 2).
  # re-updated for 94: hopper_inbox.resource_id (Phase 5 D-08).
  # re-updated for 95: KB Library index columns on search_documents/search_document_chunks + kb_index_state (KB Phase 2).
  # re-updated for 96: kb_findings inbox, search_documents.trust_tier and the legacy VoxKB DDL split into its own fragment (KB Phase 3).
  # re-updated again for 96 (digest only, still 96 -- no BASELINE_VERSION bump needed): the legacy VoxKB DDL
  # (knowledge_bases, kb_entries, kb_routing_rules) moved into domains::quarantine behind the `quarantine`
  # feature (KB Phase 3, 03-12). Existing databases keep the tables and rows; only fresh databases stop creating them.
  # Also includes workflow durability schema additions (workflow_run_log.args_json, wake_at_ms, parked_reason, workflow_patch_log) and model_benchmark_results.
  repository_baseline_digest_hex: "0x9c76d9f934573984b5003cab14ab1807f6d0ec582dc35723d84c56340a332839"
  # Keccak-256 over `vox_db::schema::baseline_sql()` (= ordered SCHEMA_FRAGMENTS + spec append DDL).
  digest_source: vox_db_schema_manifest_baseline_sql
  # Human-facing product name for the DB API layer.
  product_api_name: Codex
  # Internal schema + SQL owner crate.
  schema_owner_crate: vox-db

notes:
  - >-
    Docs and OpenAPI historically referred to baseline "1" as a conceptual greenfield label.
    The authoritative migration integer is `repository_baseline_integer` above and must match
    `pub const BASELINE_VERSION` in crates/vox-db/src/schema/manifest.rs.
    When baseline SQL changes, update `repository_baseline_digest_hex` to `vox_db::schema::schema_baseline_digest_hex()`
    (CI: `vox ci check-codex-ssot`).
  - >-
    Authoritative **bundle order** for concatenated Arca baseline DDL is `SCHEMA_FRAGMENTS` in
    `crates/vox-db/src/schema/manifest.rs` (foundation → … → publish_cloud), then the `schema::spec`
    append slice; a future logical-spec generator should emit those same two tiers.
