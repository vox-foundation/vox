x-vox-version: 1
schema_version: 1
description: >
  OmniSearch index kinds, sources and refresh policy for vox-gui. Since phase 06.3
  (D-05) the capability index (capability_index: the generated
  src/generated/capabilityIndex.generated.ts, loaded lazily by the palette) is the
  source for surface, command, mcp_tool and crate rows, and fills the gaps for doc
  and skill rows (deduped by docs/src-relative path and by skill name). The remaining
  kinds are built client-side by federatedSearchIndex.ts; backend corpus lanes
  (corpus, chat_session, achievement) are out of scope for the v1 client builder subset. The `setting`
  kind is client-federated only (SETTINGS_INDEX + config-gui-codegen); a
  vox-search / search.rs backend settings corpus is explicitly out of scope for v1.

index_kinds_v1:
  - kind: surface
    source: capability_index # + content manifest labels
    refresh: build
    description: >
      Navigable GUI surfaces. Rows come from the capability index (surface kind);
      content-manifest labels only add view keys the index lacks.

  - kind: setting
    source: SETTINGS_INDEX
    refresh: build
    backend_corpus: none # v1 — client-federated only; no search.rs / SearchCorpus lane
    description: >
      Settings rows from settingsIndex.ts + vox ci config-gui-codegen
      (generatedSettingsIndex.ts). Indexed in the browser by federatedSearchIndex.ts
      and CommandPalette; not queried via vox_search_query.

  - kind: policy
    source: policy_list
    refresh: 60s
    description: Policy catalog rows from Tauri policy_list IPC

  - kind: command
    source: capability_index # cli rows; live get_command_catalog only for form args
    refresh: build
    description: CLI commands from the capability index (cli kind)

  - kind: action
    source: ACTION_REGISTRY # keybind registry, plan 06.3-11
    refresh: build
    description: >
      Keybind actions. get_action_manifest no longer feeds the palette (its rows
      duplicated the index CLI and MCP rows).

  - kind: skill
    source: skill_catalog # installed skills; + capability_index gap-fill
    refresh: session
    description: >
      Installed agent skills from the plugin catalog. The capability index adds only
      skills that are not installed (dedupe by skill name).

  - kind: doc
    source: vox_docs_index # + capability_index gap-fill
    refresh: lazy
    description: >
      Documentation pages from the docs frontmatter walk. The capability index adds only
      docs the walk lacks (dedupe by normalized docs/src-relative path).

  - kind: mcp_tool
    source: capability_index
    refresh: build
    description: MCP tools; rendered in the Tools & crates facet (explain activation)

  - kind: crate
    source: capability_index
    refresh: build
    description: Workspace crates (layer, docs); rendered in the Tools & crates facet and the `#` mode

# Planned kinds (not built in v1 client federatedSearchIndex builder):
deferred_kinds:
  - kind: task
    source: list_orchestrator_tasks
    refresh: 5s
  - kind: chat_session
    source: chat_list_sessions
    refresh: 30s
  - kind: achievement
    source: gamify_profile
    refresh: on_event
  - kind: corpus
    source: vox_search_query
    refresh: debounced

entry_shape:
  kind: string # one of index_kinds_v1.kind
  id: string
  label: string
  detail: string
  score: number # optional at search time
  payload: object # navigation target; kind-specific
