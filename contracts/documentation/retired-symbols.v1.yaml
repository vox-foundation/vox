x-vox-version: 1
# Vox Documentation: Retired Symbols and Canonical Replacements
# Used by `vox ci retired-symbol-check` to prevent hallucination-prone identifiers from appearing in docs.

symbols:
  # Note: `\bvox-dei\b` also matches the `vox-dei` prefix inside `vox-dei-d`; `retired_symbol_check`
  # skips lines containing `vox-dei-d`, `crates/vox-dei`, or the word "retired".
  - id: vox-dei-old-crate
    pattern: "\\bvox-dei\\b"
    replacement: "vox-orchestrator"
    rationale: "Old large orchestrator crate. The new small vox-dei crate is for HITL only. If referring to HITL, ensure context is clear."
  - id: vox-ars-crate
    pattern: "\\bvox-ars(?:[^-\\w]|$)"
    replacement: "vox-openclaw-runtime"
    rationale: "Crate retired; ARS runtime types live in vox-openclaw-runtime. (vox-openclaw-runtime itself is the canonical replacement and is not flagged.)"
  - id: vox-lexer-crate
    pattern: "\\bvox-lexer\\b"
    replacement: "vox-compiler"
    rationale: "Merged into vox-compiler monolith."
  - id: vox-parser-crate
    pattern: "\\bvox-parser\\b"
    replacement: "vox-compiler"
    rationale: "Merged into vox-compiler monolith."
  - id: vox-hir-crate
    pattern: "\\bvox-hir\\b"
    replacement: "vox-compiler"
    rationale: "Merged into vox-compiler monolith."
  - id: vox-typeck-crate
    pattern: "\\bvox-typeck\\b"
    replacement: "vox-compiler"
    rationale: "Merged into vox-compiler monolith."
  - id: component-fn-decorator
    pattern: "@component fn"
    replacement: "component Name() {}"
    rationale: "Retired syntax form. Use the native component keyword."
  - id: turso-url-env
    pattern: "TURSO_URL"
    replacement: "VOX_DB_URL"
    rationale: "Legacy Turso env var. Use VOX_DB_URL for Codex."
  - id: turso-token-env
    pattern: "TURSO_AUTH_TOKEN"
    replacement: "VOX_DB_TOKEN"
    rationale: "Legacy Turso env var. Use VOX_DB_TOKEN for Codex."
  - id: vox-turso-url-env
    pattern: "VOX_TURSO_URL"
    replacement: "VOX_DB_URL"
    rationale: "Retired compatibility alias. Use VOX_DB_URL."
  - id: vox-turso-token-env
    pattern: "VOX_TURSO_TOKEN"
    replacement: "VOX_DB_TOKEN"
    rationale: "Retired compatibility alias. Use VOX_DB_TOKEN."
  # Note: `recall_async()` is ALSO deprecated, not a valid replacement (see
  # AGENTS.md §Retired Surfaces) -- `MemoryManager::persist_fact` is the
  # canonical write API and is NOT retired, so there is no `persist-fact-api`
  # entry here (a `persist_fact\(` ban was previously listed and was wrong;
  # removed rather than fixed forward, see Task 7 of the 2026-08-01
  # llm-guidance-token-audit plan for the source-of-truth correction).
  - id: sync-recall-api
    pattern: "\\brecall\\("
    replacement: "MemoryManager::lookup_fact_by_key"
    rationale: "Deprecated synchronous memory recall (recall_async() is also deprecated). Use MemoryManager::lookup_fact_by_key (async) or a RAG/retrieval bundle."
  - id: vox-ml-cli-standalone
    pattern: "\\bvox-ml-cli-standalone\\b"
    replacement: "vox-ml-cli"
    rationale: "The `-standalone` suffix dates to when the binary was split from the workspace; the canonical crate name is now `vox-ml-cli` (which itself depends on vox-populi). Only the literal old name is retired."
  - id: user-approval-arg-bypass
    pattern: "\\.get\\(\\s*\"user_approval\"\\s*\\)"
    replacement: "no arg-based approval bypass; use a transport-authenticated permission mode (T0.2/T0.3)"
    rationale: "Security-critical HITL backdoor (T0.1, 2026-07-02): reading `args.get(\"user_approval\")` in the MCP dispatch chokepoint let any tool-call argument — including ones composed by the LLM agent itself — skip the human-approval gate on dangerous tools (vox_run_shell, vox_deploy, vox_multi_replace(_file), vox_write_file, vox_delete_file). The gate must always park for a real human decision; do not reintroduce an args-based fast path. Only the `.get(\"user_approval\")` read call shape is banned, not the bare string, since tests must legitimately construct `json!({\"user_approval\": true})` to prove the key is ignored."
    scan_rust_source: true
  # ADR-048: interpreter is the isolation tier. Docs that still recommend these
  # names as live surfaces fail `vox ci retired-symbol-check`.
  - id: isolation-wasm-container-gvisor-microvm
    pattern: "--isolation (?:wasm|container|gvisor|microvm)"
    replacement: "interpreter isolation (`vox run` / `vox run --interp`); caps via repeatable `--caps`"
    rationale: "ADR-048. The interpreter is the isolation tier. wasm/container/gvisor/microvm lanes are retired."
  - id: vox-wasm-run
    pattern: "\\bvox wasm\\b"
    replacement: "vox run (interpreter)"
    rationale: "ADR-048. `vox wasm run` and the script-wasi feature are deleted."
  - id: script-wasi-feature
    pattern: "\\bscript-wasi\\b"
    replacement: "interpreter (`vox run`)"
    rationale: "ADR-048. The script-wasi cargo feature and WASI script backend are retired."
  - id: probe-only-executor
    pattern: "\\bProbeOnlyExecutor\\b"
    replacement: "InterpExecutor"
    rationale: "ADR-048 Task 10. Mesh-received Vox runs under InterpExecutor; probe-only is gone."
  - id: microvm-runtime
    pattern: "\\bMicroVmRuntime\\b"
    replacement: "interpreter isolation (ADR-048)"
    rationale: "ADR-048 Task 13. The MicroVM stub is deleted. Do not re-introduce a runtime type."
  - id: tier-microvm
    pattern: "Tier::MicroVm"
    replacement: "interpreter isolation (ADR-048); planner error-path stays"
    rationale: "ADR-048. Retirement story only; do not delete the enum variant (planner error-path stays)."
  - id: vox-mesh-exec-policy-secret
    pattern: "\\bVoxMeshExecPolicy\\b"
    replacement: "receiver-imposed `--caps`"
    rationale: "ADR-048 Task 10. SecretId deleted. The VOX_MESH_EXEC_POLICY *config* key for placement survives."
  - id: exec-bundle-b64
    pattern: "\\bexec_bundle_b64\\b"
    replacement: "VoxScript source on the mesh stream"
    rationale: "ADR-048 Task 10. The native-bundle lane is deleted; the mesh ships source only."
