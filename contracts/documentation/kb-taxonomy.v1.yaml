x-vox-version: 1
schema_version: 1
# Vox KB controlled vocabulary (SKOS-lite), KB Phase 4 / TAX-01 / D-07.
#
# - prefLabel is the exact value docs write in `topic:` / `domain:` frontmatter (lowercase kebab-case).
# - altLabel entries are synonyms: lexical search expands a query containing one into a quoted
#   facet phrase for the prefLabel (vox-search), and the facet lint uses them for did-you-mean hints.
# - Retire a label by moving it into the replacement concept's deprecatedAliases; never delete it.
# - Growth is by PR review of this file; every label may resolve to exactly one concept.
# - Read by vox-doc-pipeline (facet lint) and vox_kb_search via vox_kb_facets::Taxonomy.
domains:
  - prefLabel: language
    scopeNote: "The Vox language itself: compiler, syntax, types, code generation and editor tooling."
  - prefLabel: runtime
    scopeNote: "Executing Vox programs: actors, durable workflows, sandboxes and the shell stdlib."
  - prefLabel: orchestration
    scopeNote: "Agents, the orchestrator, MCP tools, skills and model routing."
  - prefLabel: knowledge
    scopeNote: "Search, retrieval, the knowledge base and research pipelines."
  - prefLabel: ml
    scopeNote: "MENS training, corpora, evaluation, quantization and speech models."
  - prefLabel: gui
    scopeNote: "The desktop app, terminal UI, mobile shells and other user-facing surfaces."
  - prefLabel: data
    scopeNote: "Databases, SQL backends and data contracts."
  - prefLabel: platform
    scopeNote: "CLI, build, CI, release, packaging, plugins, configuration and the toolchain."
  - prefLabel: security
    scopeNote: "Secrets, cryptography, identity, telemetry trust and privacy."
  - prefLabel: mesh
    scopeNote: "Populi mesh networking and shared transport."
  - prefLabel: documentation
    scopeNote: "Documentation governance, the doc pipeline and the contributor process."
