x-vox-version: 2
schema_version: 1

surfaces:
  - id: vox-gui
    path: crates/vox-gui
    status: canonical
    role: Primary user-facing native operator GUI surface for Vox.
    authoring_track: react-hand-authored
    source_of_truth:
      - crates/vox-gui/src/main.rs
      - crates/vox-gui/ui/src/App.tsx
      - docs/src/architecture/vox-gui-capability-audit-2026.md
    ownership:
      team: platform-gui
      review_label: gui-canonical
    notes:
      - Tauri IPC handlers in crates/vox-gui/src/commands define backend capability.
      - UI panels in crates/vox-gui/ui/src/components/surfaces must map to real handlers.
      - Browser surface (preview iframe + agent CDP live view) lives in ui/src/components/surfaces/Browser/; backend in src/commands/browser.rs.
      - "GUI-02 audit (2026-09-22): all crates/vox-gui/src Rust command-catalog consumers (catalog.rs, action_manifest.rs, discovery.rs) call vox_cli::command_catalog::build_catalog() live; the only crates/vox-gui/ui/src consumer routes through the get_command_catalog Tauri invoke (transport.ts); zero hardcoded command definitions exist in ui/src. No orphaned or duplicated command surface found."
      - "GUI-02 exemption: crates/vox-gui/src/commands/coderabbit.rs's sidecar_path_tests validates against contracts/operations/catalog.v1.yaml, not build_catalog(), because coderabbit is not a default vox-cli feature and vox-gui links vox-cli with default features only — the compiled clap catalog would never contain those paths. Test-only assertion about a sidecar subprocess, not a UI-side command declaration; does not violate ADR-045 rule 1."
      - "authoring_track invariant (2026-09-22): zero .vox source files exist under crates/vox-gui/ui/src; any .vox-derived component appearing there would cross the react-hand-authored boundary. crates/vox-gui/.vox is a directory, not a source file — checks must be scoped to ui/src."

  - id: vox-dashboard
    path: crates/vox-gui
    status: retired
    role: Retired Axum SPA dashboard; migrated into the shipped Tauri vox-gui surface (ADR-037). Retained only as a migration-history alias.
    source_of_truth:
      - docs/src/adr/045-tauri-gui-replaces-axum-dashboard.md
      - docs/src/adr/024-dashboard-axum-spa.md
    ownership:
      team: platform-gui
      review_label: gui-retired
    notes:
      - The crates/vox-dashboard crate no longer exists; all operator UX ships in vox-gui.
      - Preserve this entry for migration history only. Do not revive a standalone dashboard crate.

  - id: marquee-app
    path: apps/interop/marquee_app
    status: interoperability-reference
    role: External React integration exemplar consuming generated Vox artifacts.
    authoring_track: vox-native-interop-reference
    source_of_truth:
      - docs/src/case-studies/v0.5-production-deployment.md
      - docs/src/architecture/external-frontend-interop-plan-2026.md
    ownership:
      team: platform-gui
      review_label: gui-interop
    notes:
      - Keep scope minimal and representative; avoid feature duplication with vox-gui.

  - id: tools-visualizer
    path: apps/experimental/visualizer
    status: experimental
    role: Experimental visualization sandbox.
    source_of_truth:
      - docs/src/reference/frontend-surface-ownership.md
    ownership:
      team: platform-gui
      review_label: gui-experimental
    notes:
      - Do not duplicate canonical product UX from vox-gui.
      - Promote features by upstreaming to vox-gui and reducing local divergence.

  - id: test-app-bundle
    path: test_app_bundle
    status: fixture-only
    role: Scaffold and fixture bundle; not a canonical product surface.
    source_of_truth:
      - docs/src/reference/frontend-surface-ownership.md
    ownership:
      team: platform-ci
      review_label: gui-fixture
    notes:
      - Keep generated and fixture data deterministic for tests.
      - Avoid using this tree as a product integration reference.

  - id: vox-vscode-webview
    path: apps/editor/vox-vscode
    status: deprecated-primary-surface
    role: VS Code extension host retained for LSP and compatibility.
    source_of_truth:
      - docs/src/adr/031-deprecate-vox-vscode.md
      - docs/src/reference/vox-web-stack.md
    ownership:
      team: platform-editor
      review_label: gui-deprecated
    notes:
      - New UX and orchestration visualization ship in vox-gui.
