schema_version: 1
module: std.array
engine: numpy
ops:
  - name: from_list
    kind: plan
    signature: "(xs: list[float]) -> Array[f64]"
    handler: from_list
    expected:
      dtype: f64
      values: [1.0, 3.0]
  - name: astype
    kind: plan
    signature: "astype(dtype: f64) -> Array[f64]"
    handler: astype
    expected:
      dtype: f64
      from_ints: [1, 3]
      values: [1.0, 3.0]
  - name: add
    kind: plan
    signature: "(rhs: Array[f64]) -> Array[f64]"
    handler: add
    expected:
      dtype: f64
      lhs: [1.0, 3.0]
      rhs: [1.0, 1.0]
      values: [2.0, 4.0]
  - name: sub
    kind: plan
    signature: "(rhs: Array[f64]) -> Array[f64]"
    handler: sub
    expected:
      dtype: f64
      values: [-1.0, 1.0]
  - name: mul
    kind: plan
    signature: "(rhs: Array[f64]) -> Array[f64]"
    handler: mul
    expected:
      dtype: f64
      lhs: [2.0, 3.0]
      rhs: [4.0, 5.0]
      values: [8.0, 15.0]
  - name: div
    kind: plan
    signature: "(rhs: Array[f64]) -> Array[f64]"
    handler: div
    expected:
      dtype: f64
      values: [-1.0, 1.0]
  - name: mean
    kind: plan
    signature: "mean() -> Array[f64]"
    handler: mean
    expected:
      dtype: f64
      rank: 0
      values: [2.0]
      empty: .nan
  - name: std
    kind: plan
    signature: "std(correction: int) -> Array[f64]"
    handler: std
    required_named: [correction]
    expected:
      dtype: f64
      rank: 0
      correction: 0
      values: [1.0]
      empty: .nan
  - name: sort
    kind: plan
    signature: "sort(nulls: str) -> Array[f64]"
    handler: sort
    required_named: [nulls]
    expected:
      dtype: f64
      input: [3.0, .nan, 1.0]
      nulls_first: [.nan, 1.0, 3.0]
      nulls_last: [1.0, 3.0, .nan]
  - name: to_list
    kind: materializer
    signature: "to_list() -> Result[list[float]]"
    handler: to_list
    expected:
      host: list_f64
      identity: [1.0, 3.0]
      zscore: [-1.0, 1.0]
  - name: item
    kind: materializer
    signature: "item() -> Result[float]"
    handler: item
    expected:
      host: float
      rank: 0
      input: [2.0]
      value: 2.0
  - name: shape
    kind: materializer
    signature: "shape() -> Result[list[int]]"
    handler: shape
    expected:
      host: list_int
      input: [1.0, 3.0]
      values: [2]
